  <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ragdoll Fight Club Arena - Graphical Upgrade</title>
    <script src="./three-r128.min.js"></script>
    <script src="./OrbitControls-r128.js"></script>
    <script src="./dat.gui.min.js"></script>
    <script src="./cannon.min.js"></script>
    <script src="./Tone.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; }
        
        #ui-layer {
            position: absolute;
            top: 0; left: 0; width: 100%;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
            text-transform: uppercase;
            z-index: 10;
        }

        .bar-container {
            width: 40%;
            background: rgba(0,0,0,0.7);
            border: 3px solid #fff;
            height: 35px;
            position: relative;
            margin-bottom: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }

        .bar-label {
            position: absolute;
            top: -30px;
            left: 0;
            color: white;
            font-weight: 900;
            font-size: 1.4rem;
            text-shadow: 2px 2px 0 #000;
            letter-spacing: 1px;
        }

        .fill { height: 100%; width: 100%; transition: width 0.1s linear; }
        .stamina-fill { height: 8px; width: 100%; background: #ffff00; transition: width 0.1s linear; margin-top: 5px; box-shadow: 0 0 5px #ffff00; }

        #hp-player { background: linear-gradient(to right, #00ff88, #00cc6a); box-shadow: 0 0 10px #00ff88; }
        #hp-enemy { background: linear-gradient(to left, #ff0055, #cc0044); box-shadow: 0 0 10px #ff0055; }

        .player-side { width: 40%; }
        .enemy-side { width: 40%; text-align: right; }
        .enemy-side .bar-label { left: auto; right: 0; }

        .vs {
            color: white;
            font-size: 3rem;
            font-weight: 900;
            text-shadow: 3px 3px 0 #000;
            font-style: italic;
        }

        #game-over {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 10rem;
            color: #ffcc00;
            font-weight: 900;
            text-shadow: 5px 5px 0 #000, 0 0 20px #ffcc00;
            display: none;
            pointer-events: none;
            z-index: 100;
            font-style: italic;
        }
        
        #msg-overlay {
            position: absolute;
            top: 30%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 5rem;
            color: #fff;
            font-weight: 900;
            text-shadow: 3px 3px 0 #000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
            z-index: 90;
            font-style: italic;
        }

        #controls-hint {
            position: absolute;
            bottom: 20px; left: 20px;
            color: rgba(255,255,255,0.7);
            font-size: 1rem;
            font-weight: bold;
            text-shadow: 1px 1px 0 #000;
            pointer-events: none;
        }

        #spectate-btn {
            position: absolute;
            top: 20px; right: 20px;
            padding: 10px 20px;
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #00ff88;
            color: #00ff88;
            font-weight: bold;
            font-size: 1.2rem;
            cursor: pointer;
            z-index: 20;
            text-transform: uppercase;
            transition: all 0.2s;
        }
        #spectate-btn:hover { background: #00ff88; color: #000; }
        #spectate-btn.active { background: #ff0055; border-color: #ff0055; color: #fff; }
    </style>
</head>
<body>

    <button id="spectate-btn" onclick="toggleSpectate()">Spectate: OFF</button>

    <div id="ui-layer">
        <div class="player-side">
            <div class="bar-label">PLAYER</div>
            <div class="bar-container">
                <div class="fill" id="hp-player"></div>
            </div>
            <div class="stamina-fill" id="st-player"></div>
        </div>

        <div class="vs">VS</div>

        <div class="enemy-side">
            <div class="bar-label">ENEMY</div>
            <div class="bar-container">
                <div class="fill" id="hp-enemy"></div>
            </div>
        </div>
    </div>

    <div id="game-over">KO!</div>
    <div id="msg-overlay">PARRY!</div>

    <div id="controls-hint">
        WASD: Move | SPACE: Jump | SHIFT: Block/Parry | L-CLICK: Punch | R-CLICK: Kick | **F: Head Butt** | E: Grab
    </div>

    <script>
        let spectateMode = false;

        function toggleSpectate() {
            spectateMode = !spectateMode;
            const btn = document.getElementById('spectate-btn');
            const hint = document.getElementById('controls-hint');
            
            if(spectateMode) {
                btn.innerText = "Spectate: ON";
                btn.classList.add('active');
                hint.style.display = 'none';
            } else {
                btn.innerText = "Spectate: OFF";
                btn.classList.remove('active');
                hint.style.display = 'block';
            }
        }

        // --- 1. AUDIO SETUP ---
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();
        Tone.setContext(audioContext);

        const punchSynth = new Tone.MembraneSynth().toDestination();
        const kickSynth = new Tone.MembraneSynth({ pitchDecay:0.1 }).toDestination();
        const grabSynth = new Tone.MetalSynth({ harmonicity:12, resonance:800, modulationIndex:20 }).toDestination();
        const parrySynth = new Tone.MetalSynth({ harmonicity:5.1, modulationIndex:32, resonance:4000, envelope:{attack:0.001,decay:0.1,release:0.1} }).toDestination();
        const headbuttSynth = new Tone.MembraneSynth({ pitchDecay: 0.01, octaves: 4, envelope: { attack: 0.001, decay: 0.15, sustain: 0.01, release: 0.1 } }).toDestination();


        function playSound(type) {
            if (Tone.context.state !== 'running') Tone.context.resume().catch(()=>{});
            try {
                switch(type) {
                    case 'punch': punchSynth.triggerAttackRelease("C2", "16n"); break;
                    case 'kick': kickSynth.triggerAttackRelease("G1", "8n"); break;
                    case 'grab': grabSynth.triggerAttackRelease("32n"); break;
                    case 'parry': parrySynth.triggerAttackRelease("16n"); break;
                    case 'knockdown': kickSynth.triggerAttackRelease("C1", "4n"); break;
                    case 'headbutt': headbuttSynth.triggerAttackRelease("D3", "16n"); break;
                }
            } catch(e) { }
        }
        
        function showMessage(text, color) {
            const el = document.getElementById('msg-overlay');
            el.innerText = text; el.style.color = color; el.style.opacity = 1;
            setTimeout(() => { el.style.opacity = 0; }, 800);
        }

        // --- 2. PARTICLE SYSTEM ---
        const MAX_PARTICLES = 80;
        const particleGeo = new THREE.DodecahedronGeometry(0.3, 0);
        const particleMat = new THREE.MeshStandardMaterial({ color: 0xffaa00, emissive: 0xff5500, roughness: 0.5, metalness: 1.0 });
        const particlePool = [];
        
        function initParticles(scene) {
            for(let i=0; i<MAX_PARTICLES; i++) {
                const mesh = new THREE.Mesh(particleGeo, particleMat.clone());
                mesh.visible = false; mesh.castShadow = true;
                scene.add(mesh);
                particlePool.push({ mesh, vel: new THREE.Vector3(), life: 0, active: false });
            }
        }

        function spawnHitParticles(pos, count, colorHex) {
            let spawned = 0;
            for(let i=0; i<particlePool.length; i++) {
                if(spawned >= count) break;
                const p = particlePool[i];
                if(!p.active) {
                    p.active = true; p.life = 1.0; p.mesh.visible = true;
                    p.mesh.position.copy(pos);
                    p.mesh.position.x += (Math.random()-0.5)*3;
                    p.mesh.position.y += (Math.random()-0.5)*3;
                    p.mesh.position.z += (Math.random()-0.5)*3;
                    p.mesh.material.color.setHex(colorHex);
                    p.mesh.material.emissive.setHex(colorHex);
                    p.vel.set((Math.random()-0.5)*1.5, Math.random()*1.5, (Math.random()-0.5)*1.5);
                    spawned++;
                }
            }
        }

        function updateParticles() {
            particlePool.forEach(p => {
                if(p.active) {
                    p.life -= 0.04;
                    p.mesh.position.add(p.vel);
                    p.mesh.rotation.x += 0.2; p.mesh.rotation.y += 0.2;
                    p.mesh.scale.setScalar(p.life * 1.5);
                    if(p.life <= 0) { p.active = false; p.mesh.visible = false; }
                }
            });
        }

        // --- 3. TEXTURE GENERATION ---
        function generateTexture(type, baseColorHex) {
            const size = 512; const canvas = document.createElement('canvas');
            canvas.width = size; canvas.height = size; const ctx = canvas.getContext('2d');
            const baseColor = new THREE.Color(baseColorHex);
            ctx.fillStyle = `rgb(${baseColor.r*255},${baseColor.g*255},${baseColor.b*255})`;
            ctx.fillRect(0, 0, size, size);
            
            const imageData = ctx.getImageData(0, 0, size, size);
            const data = imageData.data;

            for (let i = 0; i < data.length; i += 4) {
                const noise = (Math.random() - 0.5) * 30;
                data[i] += noise; data[i+1] += noise; data[i+2] += noise;
            }
            ctx.putImageData(imageData, 0, 0);

            if (type === 'mat') {
                ctx.strokeStyle = 'rgba(0,0,0,0.1)'; ctx.lineWidth = 2;
                for(let i=0; i<size; i+=20) { ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(size, i); ctx.stroke(); }
                for(let i=0; i<size; i+=20) { ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, size); ctx.stroke(); }
            } else if (type === 'wood') {
                ctx.strokeStyle = 'rgba(0,0,0,0.2)'; ctx.lineWidth = 4;
                for(let i=0; i<size; i+=30 + Math.random()*20) {
                    ctx.beginPath(); ctx.moveTo(0, i);
                    ctx.bezierCurveTo(size/3, i+Math.random()*20, size*2/3, i-Math.random()*20, size, i);
                    ctx.stroke();
                }
            } else if (type === 'wood_floor') {
                // Detailed wood planks
                ctx.strokeStyle = 'rgba(0,0,0,0.4)'; ctx.lineWidth = 3;
                const plankW = 64;
                for(let i=0; i<size; i+=plankW) {
                    ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(size, i); ctx.stroke();
                    const offset = (i/plankW)%2 * (size/2);
                    for(let j=offset; j<size; j+=size/2) {
                        ctx.beginPath(); ctx.moveTo(j, i); ctx.lineTo(j, i+plankW); ctx.stroke();
                    }
                    // Grain
                    ctx.save();
                    ctx.strokeStyle = 'rgba(0,0,0,0.1)'; ctx.lineWidth = 1;
                    for(let k=0; k<5; k++) {
                        let y = i + Math.random()*plankW;
                        ctx.beginPath(); ctx.moveTo(0, y);
                        ctx.bezierCurveTo(size/3, y+10, size*2/3, y-10, size, y);
                        ctx.stroke();
                    }
                    ctx.restore();
                }
            } else if (type === 'rope') {
                ctx.strokeStyle = 'rgba(255,255,255,0.3)'; ctx.lineWidth = 6;
                for(let i=-size; i<size; i+=20) { ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i+size, size); ctx.stroke(); }
            } else if (type === 'arena_wall') {
                // Dark textured wall/concrete
                ctx.fillStyle = `rgb(30, 30, 30)`;
                ctx.fillRect(0, 0, size, size);
                ctx.strokeStyle = 'rgba(255,255,255,0.05)'; ctx.lineWidth = 4;
                for(let i=0; i<size; i+=100) {
                    for(let j=0; j<size; j+=100) {
                        ctx.strokeRect(j, i, 100, 100);
                    }
                }
            }

            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = THREE.RepeatWrapping; texture.wrapT = THREE.RepeatWrapping;
            return texture;
        }

        // Available skin colors for audience randomization
        const AUDIENCE_SKIN_COLORS = [
            '#f7d7c4', // Light Beige
            '#e1b899', // Tan
            '#c79471', // Brown
            '#a1684a', // Dark Brown
            '#785340', // Deep Brown
        ];

        function getRandomSkinColor() {
            return AUDIENCE_SKIN_COLORS[Math.floor(Math.random() * AUDIENCE_SKIN_COLORS.length)];
        }

        function createSkinMaterial(colorHex, isFace = false) {
            const size = 256; const canvas = document.createElement('canvas');
            canvas.width = size; canvas.height = size; const ctx = canvas.getContext('2d');
            const baseColor = new THREE.Color(colorHex);
            ctx.fillStyle = `rgb(${baseColor.r*255},${baseColor.g*255},${baseColor.b*255})`;
            ctx.fillRect(0, 0, size, size);
            const imageData = ctx.getImageData(0, 0, size, size);
            const data = imageData.data;
            for (let i = 0; i < data.length; i += 4) {
                const noise = (Math.random() - 0.5) * 25; 
                data[i] += noise; data[i+1] += noise; data[i+2] += noise;
            }
            ctx.putImageData(imageData, 0, 0);
            
            if (isFace) {
                ctx.fillStyle = '#111';
                ctx.beginPath(); ctx.moveTo(60, 110); ctx.lineTo(120, 135); ctx.lineTo(60, 145); ctx.fill(); 
                ctx.beginPath(); ctx.moveTo(196, 110); ctx.lineTo(136, 135); ctx.lineTo(196, 145); ctx.fill(); 
                ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(95, 130, 4, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(161, 130, 4, 0, Math.PI*2); ctx.fill();
                ctx.strokeStyle = '#111'; ctx.lineWidth = 8; 
                ctx.beginPath(); ctx.moveTo(50, 95); ctx.lineTo(120, 120); ctx.stroke(); 
                ctx.beginPath(); ctx.moveTo(206, 95); ctx.lineTo(136, 120); ctx.stroke(); 
                ctx.strokeStyle = '#500'; ctx.lineWidth = 10; 
                ctx.beginPath(); ctx.arc(128, 170, 25, 3.4, 6.0); ctx.stroke(); 
            }
            return new THREE.MeshStandardMaterial({ map: new THREE.CanvasTexture(canvas), roughness: 0.8, metalness: 0.1, emissive: 0x000000 });
        }

        // --- 4. WORLD SETUP ---
        const world = new CANNON.World();
        world.gravity.set(0, -400, 0); 
        world.broadphase = new CANNON.NaiveBroadphase();
        world.solver.iterations = 20; world.solver.tolerance = 0.001;

        const physicsMaterial = new CANNON.Material("slipperyMaterial");
        const physicsContactMaterial = new CANNON.ContactMaterial(physicsMaterial, physicsMaterial, { friction: 0.1, restitution: 0.0 });
        world.addContactMaterial(physicsContactMaterial);

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x111111); 
        scene.fog = new THREE.Fog(0x111111, 80, 250); 

        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.outputEncoding = THREE.sRGBEncoding;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        document.body.appendChild(renderer.domElement);

        initParticles(scene);

        const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.6);
        hemiLight.position.set(0, 100, 0);
        scene.add(hemiLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1.0); // Reduced intensity slightly
        dirLight.position.set(50, 100, 50);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048; dirLight.shadow.mapSize.height = 2048;
        dirLight.shadow.camera.left = -100; dirLight.shadow.camera.right = 100;
        dirLight.shadow.camera.top = 100; dirLight.shadow.camera.bottom = -100;
        dirLight.shadow.bias = -0.0005;
        scene.add(dirLight);

        // --- 5. ARENA WITH TEXTURES & WALLS ---
        const ringSize = 60; const platformHeight = 5; const ropeHeight = 10;
        const arenaRadius = ringSize * 1.5;
        const arenaHeight = 60;
        
        // Wooden Floor (Outside Ring)
        const woodFloorTex = generateTexture('wood_floor', 0x5d4037); woodFloorTex.repeat.set(10, 10);
        const planeBody = new CANNON.Body({ mass: 0, shape: new CANNON.Plane(), material: physicsMaterial });
        planeBody.quaternion.setFromAxisAngle(new CANNON.Vec3(1,0,0), -Math.PI/2); world.addBody(planeBody);
        const planeMesh = new THREE.Mesh(new THREE.PlaneGeometry(500, 500), new THREE.MeshStandardMaterial({ map: woodFloorTex, roughness: 0.7, metalness: 0.1 }));
        planeMesh.rotation.x = -Math.PI / 2; planeMesh.receiveShadow = true; scene.add(planeMesh);

        // Platform (Wood Sides)
        const woodTex = generateTexture('wood', 0x3a2a1a); woodTex.repeat.set(4, 1);
        const platBody = new CANNON.Body({ mass: 0, shape: new CANNON.Box(new CANNON.Vec3(ringSize/2, platformHeight/2, ringSize/2)), material: physicsMaterial });
        platBody.position.y = platformHeight / 2; world.addBody(platBody);
        const platMesh = new THREE.Mesh(new THREE.BoxGeometry(ringSize, platformHeight, ringSize), [
            new THREE.MeshStandardMaterial({ map: woodTex, roughness: 0.8 }), 
            new THREE.MeshStandardMaterial({ map: woodTex, roughness: 0.8 }), 
            new THREE.MeshStandardMaterial({ color: 0x1a1a1a }), 
            new THREE.MeshStandardMaterial({ color: 0x1a1a1a }), 
            new THREE.MeshStandardMaterial({ map: woodTex, roughness: 0.8 }), 
            new THREE.MeshStandardMaterial({ map: woodTex, roughness: 0.8 })  
        ]);
        platMesh.position.y = platformHeight / 2; platMesh.receiveShadow = true; scene.add(platMesh);

        // Mat (Canvas)
        const canvasMesh = new THREE.Mesh(new THREE.BoxGeometry(ringSize - 1, 0.2, ringSize - 1), new THREE.MeshStandardMaterial({ map: generateTexture('mat', 0x8B0000), roughness: 0.9 }));
        canvasMesh.position.y = platformHeight + 0.1; canvasMesh.receiveShadow = true; scene.add(canvasMesh);

        // Posts (Metal)
        const postGeo = new THREE.CylinderGeometry(1.2, 1.2, ropeHeight + platformHeight, 16);
        const postMat = new THREE.MeshStandardMaterial({ color: 0x555555, metalness: 0.8, roughness: 0.3 });
        const cornerDist = ringSize / 2;
        const corners = [{ x: cornerDist, z: cornerDist }, { x: -cornerDist, z: cornerDist }, { x: -cornerDist, z: -cornerDist }, { x: cornerDist, z: -cornerDist }];
        corners.forEach(pos => {
            const body = new CANNON.Body({ mass: 0, shape: new CANNON.Cylinder(1.2, 1.2, ropeHeight + platformHeight, 8), material: physicsMaterial });
            body.position.set(pos.x, (ropeHeight+platformHeight)/2, pos.z); world.addBody(body);
            const mesh = new THREE.Mesh(postGeo, postMat); mesh.position.copy(body.position); mesh.castShadow = true; scene.add(mesh);
            const cover = new THREE.Mesh(new THREE.CylinderGeometry(1.5, 1.5, 2, 16), new THREE.MeshStandardMaterial({color: 0xaa0000, roughness: 0.6}));
            cover.position.set(pos.x, platformHeight + 4, pos.z); scene.add(cover);
            const cover2 = cover.clone(); cover2.position.y = platformHeight + 7; scene.add(cover2);
            const cover3 = cover.clone(); cover3.position.y = platformHeight + 10; scene.add(cover3);
        });

        // Ropes
        const ropeTex = generateTexture('rope', 0xeeeeee); ropeTex.repeat.set(10, 1);
        const ropeMat = new THREE.MeshStandardMaterial({ map: ropeTex, roughness: 0.7 });
        for(let i=0; i<4; i++) {
            const p1 = corners[i], p2 = corners[(i+1)%4];
            [4, 7, 10].forEach(yOffset => {
                const len = Math.sqrt(Math.pow(p2.x-p1.x,2) + Math.pow(p2.z-p1.z,2));
                const rope = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, len, 12), ropeMat);
                rope.position.set((p1.x+p2.x)/2, platformHeight+yOffset, (p1.z+p2.z)/2);
                rope.rotation.y = -Math.atan2(p2.z-p1.z, p2.x-p1.x); rope.rotation.z = Math.PI/2;
                rope.castShadow = true; scene.add(rope);
            });
        }
        
        // Invisible collision walls (kept for containment)
        [ {x:0, z:cornerDist, w:ringSize, d:1}, {x:0, z:-cornerDist, w:ringSize, d:1}, {x:cornerDist, z:0, w:1, d:ringSize}, {x:-cornerDist, z:0, w:1, d:ringSize} ].forEach(w => {
            const body = new CANNON.Body({ mass: 0, shape: new CANNON.Box(new CANNON.Vec3(w.w/2, 6, w.d/2)), material: physicsMaterial });
            body.position.set(w.x, platformHeight+6, w.z); world.addBody(body);
        });

        // Arena Backdrop Walls (Visuals only)
        const wallTex = generateTexture('arena_wall', 0x222222); wallTex.repeat.set(5, 5);
        const wallMat = new THREE.MeshStandardMaterial({ map: wallTex, roughness: 0.8, metalness: 0.1, side: THREE.DoubleSide });

        const wallDistance = arenaRadius * 1.5;
        const wallPositions = [
            { x: 0, z: wallDistance, rotation: 0 },
            { x: 0, z: -wallDistance, rotation: 0 },
            { x: wallDistance, z: 0, rotation: Math.PI / 2 },
            { x: -wallDistance, z: 0, rotation: Math.PI / 2 }
        ];

        wallPositions.forEach(pos => {
            const wallGeo = new THREE.PlaneGeometry(wallDistance * 2, arenaHeight);
            const wallMesh = new THREE.Mesh(wallGeo, wallMat);
            wallMesh.position.set(pos.x, arenaHeight / 2, pos.z);
            wallMesh.rotation.y = pos.rotation;
            wallMesh.receiveShadow = true;
            scene.add(wallMesh);
        });


        // Crowd / Seats (Updated to use blocky human figures with full limbs)
        const audRadiusSeats = ringSize * 1.3;
        const audienceSeatMat = new THREE.MeshStandardMaterial({color:0x222222, roughness: 0.9}); 
        
        for(let i=0; i<30; i++) {
            const angle = (i / 30) * Math.PI * 2;
            const x = Math.cos(angle) * audRadiusSeats;
            const z = Math.sin(angle) * audRadiusSeats;
            
            // Seat Mesh (Dark Gray)
            const seatMesh = new THREE.Mesh(new THREE.BoxGeometry(4, 2, 4), audienceSeatMat);
            seatMesh.position.set(x, platformHeight + 1, z); seatMesh.lookAt(0,platformHeight,0); seatMesh.receiveShadow = true; scene.add(seatMesh);
            
            if(Math.random() > 0.1) { // 90% chance to have a spectator
                const skinColor = getRandomSkinColor();
                const personMat = createSkinMaterial(skinColor, false);
                const headMat = createSkinMaterial(skinColor, true);

                const spectatorGroup = new THREE.Group();
                spectatorGroup.position.set(x, platformHeight + 3.5, z);
                spectatorGroup.lookAt(0, platformHeight, 0); // Face the center
                scene.add(spectatorGroup);

                // Body (Torso/Hips combined for simplicity)
                const bodyMesh = new THREE.Mesh(new THREE.BoxGeometry(2, 3.5, 2), personMat);
                bodyMesh.position.y = 0; // Relative to group center
                bodyMesh.castShadow = true; spectatorGroup.add(bodyMesh);

                // Head
                const headMesh = new THREE.Mesh(new THREE.BoxGeometry(1.5, 1.8, 1.5), headMat);
                headMesh.position.y = 2.75; // 3.5/2 + 1.8/2 = 1.75 + 0.9 = 2.65 -> using 2.75 for visual spacing
                headMesh.castShadow = true; spectatorGroup.add(headMesh);
                
                // Arms (Hanging down, bent slightly for sitting)
                const armGeo = new THREE.BoxGeometry(0.8, 2.5, 0.8);
                const lArmMesh = new THREE.Mesh(armGeo, personMat);
                lArmMesh.position.set(1.5, 0.0, 0); 
                lArmMesh.rotation.z = Math.PI / 6; 
                lArmMesh.castShadow = true; spectatorGroup.add(lArmMesh);

                const rArmMesh = new THREE.Mesh(armGeo, personMat);
                rArmMesh.position.set(-1.5, 0.0, 0); 
                rArmMesh.rotation.z = -Math.PI / 6; 
                rArmMesh.castShadow = true; spectatorGroup.add(rArmMesh);

                // Legs (Simple sitting bend)
                const legGeo = new THREE.BoxGeometry(1.0, 2.5, 1.0);
                const lLegMesh = new THREE.Mesh(legGeo, personMat);
                lLegMesh.position.set(0.5, -2.75, 0.5); 
                lLegMesh.rotation.x = -Math.PI / 4; 
                lLegMesh.castShadow = true; spectatorGroup.add(lLegMesh);
                
                const rLegMesh = new THREE.Mesh(legGeo, personMat);
                rLegMesh.position.set(-0.5, -2.75, 0.5);
                rLegMesh.rotation.x = -Math.PI / 4; 
                rLegMesh.castShadow = true; spectatorGroup.add(rLegMesh);

        // --- 6. HUMAN CLASS & LLM CHAT SETUP ---

        // LLM related global variables
        const chatBubbleGroup = new THREE.Group();
        scene.add(chatBubbleGroup);
        let chatBubbleMesh = null;
        const LLM_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=`;
        let font;

        new THREE.FontLoader().load('./helvetiker_regular.typeface.json', (loadedFont) => {
            font = loadedFont;
        });

        function clearChatBubble() {
            if (chatBubbleMesh) {
                chatBubbleGroup.remove(chatBubbleMesh);
                chatBubbleMesh.geometry.dispose();
                chatBubbleMesh.material.dispose();
                chatBubbleMesh = null;
            }
        }

        function setChatBubble(character, text) {
            clearChatBubble();

            if (!font) return;

            const geometry = new THREE.TextGeometry(text, {
                font: font,
                size: 3, 
                height: 0.5,
                curveSegments: 4,
            });

            geometry.computeBoundingBox();
            const centerOffset = -0.5 * (geometry.boundingBox.max.x - geometry.boundingBox.min.x);

            const material = new THREE.MeshBasicMaterial({ color: character.isPlayer ? 0x00ff88 : 0xff0055 });
            chatBubbleMesh = new THREE.Mesh(geometry, material);
            
            // Position above the head of the character
            const headPosition = character.head.position;
            chatBubbleMesh.position.set(headPosition.x + centerOffset, headPosition.y + 5, headPosition.z);
            chatBubbleMesh.rotation.y = character.rotation; 
            
            chatBubbleGroup.add(chatBubbleMesh);

            setTimeout(clearChatBubble, 5000); // Clear after 5 seconds
        }

        async function generateTaunt(character, target, combatState) {
            if (character.isDead || character.isRagdoll || character.isStunned) return;

            const persona = character.isPlayer ? "The Cocky Champion" : "The Vengeful Challenger";
            const opponent = target.isPlayer ? "Champion" : "Challenger";

            const prompt = `You are ${persona}. The match is heated. Respond to this combat state in a short, trash-talking sentence (max 10 words). State: ${combatState} (Opponent: ${opponent}).`;

            const payload = {
                contents: [{ parts: [{ text: prompt }] }],
                systemInstruction: { parts: [{ text: `Act as a wrestling trash-talk commentator. Your tone must be aggressive and theatrical. Response must be extremely short (max 10 words).` }] }
            };

            const apiKey = "";
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;

            try {
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const result = await response.json();
                const text = result.candidates?.[0]?.content?.parts?.[0]?.text || "I'm still standing!";
                setChatBubble(character, text.trim());
            } catch (error) {
                console.error("LLM Taunt Error:", error);
            }
        }


        let screenShake = 0;

        class Human {
            constructor(x, z, colorHex, isPlayer = false) {
                this.isPlayer = isPlayer;
                this.parts = [];
                this.constraints = [];
                this.isRagdoll = false;
                this.isDead = false;
                this.recoveryTimer = 0;
                this.isStunned = false; 
                this.stunTimer = 0;     
                this.recoil = 0;        
                this.aiTimer = 0;
                this.tauntCooldown = 0; 

                this.hp = 100;
                this.maxHp = 100;
                this.stamina = 100; 
                this.maxStamina = 100;
                this.punching = 0;
                this.kicking = 0; 
                this.headbutting = 0; 
                this.blocking = false; 
                this.blockStart = 0; 
                this.hitCooldown = 0;
                this.attackCooldown = 0; 
                this.walkTime = Math.random() * 100;

                this.bodyMat = createSkinMaterial(colorHex, false);
                this.faceMat = createSkinMaterial(colorHex, true);
                this.headMaterials = [this.bodyMat, this.bodyMat, this.bodyMat, this.bodyMat, this.bodyMat, this.faceMat];

                this.position = new THREE.Vector3(x, 0, z);
                this.rotation = 0;
                this.buildBody(x, platformHeight + 9.5, z); 
                this.setRagdoll(false);
            }

            createPart(w, h, d, x, y, z, mass, name, isHead = false) {
                const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), isHead ? this.headMaterials : this.bodyMat);
                mesh.castShadow = true; mesh.receiveShadow = true;
                scene.add(mesh);
                const body = new CANNON.Body({ mass: mass, material: physicsMaterial, linearDamping: 0.1, shape: new CANNON.Box(new CANNON.Vec3(w/2, h/2, d/2)) });
                body.position.set(x, y, z);
                world.addBody(body);
                this.parts.push({ mesh, body, name, w, h, d });
                return { mesh, body };
            }

            buildBody(sx, sy, sz) {
                this.hips = this.createPart(3.2, 2, 2, sx, sy, sz, 10).body;
                this.torso = this.createPart(3.5, 4, 2.2, sx, sy+3.5, sz, 15).body;
                this.head = this.createPart(2.5, 3, 2.8, sx, sy+7.5, sz, 5, true).body;
                this.lArmU = this.createPart(1.2, 3.5, 1.2, sx+2.8, sy+3, sz, 3).body;
                this.lArmL = this.createPart(1, 3.5, 1, sx+2.8, sy-0.5, sz, 2).body;
                this.rArmU = this.createPart(1.2, 3.5, 1.2, sx-2.8, sy+3, sz, 3).body;
                this.rArmL = this.createPart(1, 3.5, 1, sx-2.8, sy-0.5, sz, 2).body;
                this.lLegU = this.createPart(1.4, 4.5, 1.4, sx+1, sy-3.5, sz, 5).body;
                this.lLegL = this.createPart(1.2, 4.5, 1.2, sx+1, sy-8, sz, 4).body;
                this.rLegU = this.createPart(1.4, 4.5, 1.4, sx-1, sy-3.5, sz, 5).body;
                this.rLegL = this.createPart(1.2, 4.5, 1.2, sx-1, sy-8, sz, 4).body;

                const connect = (b1, b2, p1, p2, hinge=false) => {
                    const c = hinge ? 
                        new CANNON.HingeConstraint(b1, b2, { pivotA: new CANNON.Vec3(...p1), pivotB: new CANNON.Vec3(...p2), axisA: new CANNON.Vec3(1,0,0), axisB: new CANNON.Vec3(1,0,0) }) :
                        new CANNON.ConeTwistConstraint(b1, b2, { pivotA: new CANNON.Vec3(...p1), pivotB: new CANNON.Vec3(...p2), axisA: new CANNON.Vec3(0,1,0), axisB: new CANNON.Vec3(0,1,0) });
                    this.constraints.push(c);
                };
                connect(this.hips, this.torso, [0,1,0], [0,-2,0]);
                connect(this.torso, this.head, [0,2,0], [0,-1.5,0]);
                connect(this.torso, this.lArmU, [2,1.5,0], [0,2,0]);
                connect(this.lArmU, this.lArmL, [0,-2,0], [0,2,0], true);
                connect(this.torso, this.rArmU, [-2,1.5,0], [0,2,0]);
                connect(this.rArmU, this.rArmL, [0,-2,0], [0,2,0], true);
                connect(this.hips, this.lLegU, [1,-1,0], [0,2.5,0]);
                connect(this.lLegU, this.lLegL, [0,-2.5,0], [0,2.5,0], true);
                connect(this.hips, this.rLegU, [-1,-1,0], [0,2.5,0]);
                connect(this.rLegU, this.rLegL, [0,-2.5,0], [0,2.5,0], true);
            }

            setRagdoll(active) {
                const wasRagdoll = this.isRagdoll;
                this.isRagdoll = active;
                if (active && !wasRagdoll && !this.isDead) { playSound('knockdown'); this.recoveryTimer = 0.5; }
                this.parts.forEach(p => {
                    p.body.type = active ? CANNON.Body.DYNAMIC : CANNON.Body.KINEMATIC;
                    if(active) { p.body.wakeUp(); p.body.linearDamping = 0.1; }
                    else { p.body.velocity.set(0,0,0); p.body.angularVelocity.set(0,0,0); }
                });
                this.constraints.forEach(c => {
                    if(active) world.addConstraint(c);
                    else world.removeConstraint(c);
                });
                if(!active) this.snapToIdle();
            }

            snapToIdle() {
                if(this.isDead) return;
                this.position.x = this.hips.position.x;
                this.position.z = this.hips.position.z;
                this.hips.position.set(this.position.x, platformHeight + 9, this.position.z);
                this.hips.quaternion.setFromEuler(0, this.rotation, 0);
            }

            takeDamage(amount, force) {
                if(this.isDead) return;
                
                const target = this.isPlayer ? npcs[0] : player;

                if(this.blocking && (Date.now()-this.blockStart < 250)) { 
                    showMessage("PARRY!", "#ffff00"); playSound('parry'); 
                    spawnHitParticles(this.torso.position, 10, 0xffff00); 
                    if (this.tauntCooldown <= 0) { generateTaunt(this, target, "PARRY_SUCCESS"); this.tauntCooldown = 4; }
                    return "PARRIED"; 
                }
                
                if(this.blocking) { amount *= 0.1; force.scale(0.1, force); }
                this.hp -= amount;
                this.recoil = 1.0;
                spawnHitParticles(this.torso.position, 5, 0xff0000);
                screenShake = 0.5;
                
                if (this.tauntCooldown <= 0) { generateTaunt(this, target, "HIT_TAKEN"); this.tauntCooldown = 3; }

                if(this.hp <= 0) {
                    this.hp = 0; this.isDead = true; this.setRagdoll(true);
                    document.getElementById('game-over').style.display = 'block';
                    setTimeout(() => { location.reload(); }, 4000);
                }
                const id = this.isPlayer ? "hp-player" : "hp-enemy";
                document.getElementById(id).style.width = (this.hp / 100 * 100) + "%";
                return "HIT";
            }

            punch() {
                if(this.punching>0 || this.kicking>0 || this.headbutting>0 || this.isRagdoll || this.blocking || this.isStunned || this.stamina < 10) return;
                this.stamina -= 10; this.punching = 1;
                this.performAttack(10, 2500, 10, 'punch');
            }

            kick() {
                if(this.punching>0 || this.kicking>0 || this.headbutting>0 || this.isRagdoll || this.blocking || this.isStunned || this.stamina < 20) return;
                this.stamina -= 20; this.kicking = 1;
                this.performAttack(25, 5000, 12, 'kick');
            }
            
            headbutt() {
                if(this.punching>0 || this.kicking>0 || this.headbutting>0 || this.isRagdoll || this.blocking || this.isStunned || this.stamina < 15) return;
                this.stamina -= 15; this.headbutting = 1;
                this.performAttack(18, 500, 4, 'headbutt', true); 
            }

            performAttack(damage, forceVal, range, sfx, highStun=false) {
                const pPos = this.hips.position;
                const fwd = new THREE.Vector3(0,0,-1).applyAxisAngle(new THREE.Vector3(0,1,0), this.rotation);
                const targets = this.isPlayer ? npcs : [player];
                targets.forEach(t => {
                    if(t.isRagdoll || pPos.distanceTo(t.hips.position) > range) return;
                    const toTarget = new THREE.Vector3().subVectors(t.hips.position, pPos).normalize();
                    
                    if (isNaN(toTarget.x)) return;

                    if(fwd.dot(toTarget) > 0.5) {
                        playSound(sfx);
                        const force = new CANNON.Vec3(fwd.x * forceVal, forceVal*0.5, fwd.z * forceVal);
                        const res = t.takeDamage(damage, force);
                        
                        if (this.tauntCooldown <= 0) { generateTaunt(this, t, "HIT_LANDED"); this.tauntCooldown = 3; }

                        if(res === "PARRIED") { this.isStunned = true; this.stunTimer = 2.0; }
                        else if(highStun && res === "HIT") { 
                            t.isStunned = true; t.stunTimer = 1.5;
                        }
                        
                        if(!t.blocking || damage > 20) {
                             t.setRagdoll(true); t.hitCooldown = 30;
                             t.torso.applyImpulse(force, t.torso.position);
                        }
                    }
                });
            }

            jump() {
                if(this.isRagdoll || this.stamina < 20 || this.isStunned) return;
                this.stamina -= 20; this.setRagdoll(true);
                this.hips.velocity.set(0, 60, 0); this.recoveryTimer = 1.0;
            }
            
            grab() {
                if(this.punching>0 || this.kicking>0 || this.headbutting>0 || this.isRagdoll || this.blocking || this.isStunned || this.stamina < 40) return;
                this.stamina -= 40; 
                this.punching = 0.5; 

                const pPos = this.hips.position;
                const fwd = new THREE.Vector3(0,0,-1).applyAxisAngle(new THREE.Vector3(0,1,0), this.rotation);
                const targets = this.isPlayer ? npcs : [player];
                
                targets.forEach(t => {
                    if(t.isRagdoll) return;
                    if(pPos.distanceTo(t.hips.position) < 8) {
                         const toTarget = new THREE.Vector3().subVectors(t.hips.position, pPos).normalize();
                         if (isNaN(toTarget.x)) return; 
                         if(fwd.dot(toTarget) > 0.5) {
                             playSound('grab'); showMessage("GRABBED!", "#ff00ff");
                             t.takeDamage(15, new CANNON.Vec3(0,0,0)); 
                             t.setRagdoll(true);
                             t.hitCooldown = 100;
                             
                             const throwForce = 4000;
                             const impulse = new CANNON.Vec3(fwd.x * throwForce, throwForce * 0.7, fwd.z * throwForce);
                             t.torso.applyImpulse(impulse, t.torso.position);

                             if (this.tauntCooldown <= 0) { generateTaunt(this, t, "GRAB_SUCCESS"); this.tauntCooldown = 4; }
                         }
                    }
                });
            }
            
            startBlock() { this.blocking = true; this.blockStart = Date.now(); }

            // Unified AI Update Method to support spectate mode
            updateAI(dt, target) {
                this.aiTimer += dt;
                if(this.isDead || this.isRagdoll || this.isStunned) return;
                if(this.tauntCooldown > 0) this.tauntCooldown -= dt;

                if(this.aiTimer > 0.05) {
                    this.aiTimer = 0;
                    
                    const dist = this.hips.position.distanceTo(target.hips.position);
                    const distFromCenter = this.hips.position.length();
                    const ringHalfWidth = 25; 
                    const attackRange = 8;
                    const headbuttRange = 4;

                    // Bounds Check: Prioritize getting back into the ring
                    if(distFromCenter > ringHalfWidth) {
                        const toCenter = new THREE.Vector3(0,0,0).sub(this.hips.position).normalize();
                        this.rotation = Math.atan2(toCenter.x, toCenter.z) + Math.PI;
                        const fwd = new THREE.Vector3(0,0,-1).applyAxisAngle(new THREE.Vector3(0,1,0), this.rotation);
                        this.hips.position.x += fwd.x * 10 * dt; 
                        this.hips.position.z += fwd.z * 10 * dt;
                        this.update(dt, 1);
                        return;
                    }

                    // Combat Logic
                    const toTarget = new THREE.Vector3().subVectors(target.hips.position, this.hips.position);
                    this.rotation = Math.atan2(toTarget.x, toTarget.z) + Math.PI;

                    if(this.attackCooldown <= 0) {
                        if (dist < headbuttRange && Math.random() < 0.25) { // High chance to headbutt close
                            this.headbutt();
                            this.attackCooldown = 0.5 + Math.random();
                        } else if(dist < attackRange && Math.random() < 0.30) { // Attack chance
                            if(Math.random() < 0.5) this.punch(); else this.kick();
                            this.attackCooldown = 0.5 + Math.random();
                        } else if (dist < attackRange && this.stamina > 80 && Math.random() < 0.1) {
                             this.grab(); // Throw chance
                             this.attackCooldown = 1.0 + Math.random();
                        }
                    }

                    // Movement Logic
                    if (dist > 6) {
                        const fwd = new THREE.Vector3(0,0,-1).applyAxisAngle(new THREE.Vector3(0,1,0), this.rotation);
                        this.hips.position.x += fwd.x * 10 * dt; 
                        this.hips.position.z += fwd.z * 10 * dt;
                        this.update(dt, 1);
                    } else { 
                        this.update(dt, 0); 
                    }
                } else {
                    this.update(dt, 0); // Idle
                }
            }

            update(dt, speed) {
                this.parts.forEach(p => { p.mesh.position.copy(p.body.position); p.mesh.quaternion.copy(p.body.quaternion); });
                
                if(this.tauntCooldown > 0) this.tauntCooldown -= dt;

                let color = 0x000000;
                if(this.isStunned) color = 0xffff00; else if(this.hp < 30) color = 0xff0000;
                this.parts.forEach(p => { if(p.mesh.material.emissive) p.mesh.material.emissive.setHex(color); });

                if(this.hitCooldown>0) this.hitCooldown--;
                if(this.attackCooldown>0) this.attackCooldown-=dt;
                if(this.recoil>0) this.recoil-=dt*5;
                if(this.headbutting>0) { this.headbutting -= dt*5; if(this.headbutting<0) this.headbutting=0; }
                if(this.isStunned) { this.stunTimer-=dt; if(this.stunTimer<=0) this.isStunned=false; return; }

                if(this.stamina<100) this.stamina+=0.5;
                if(this.isPlayer) document.getElementById('st-player').style.width = this.stamina + "%";

                if(this.isRagdoll && !this.isDead) {
                    this.recoveryTimer -= dt;
                    if(this.recoveryTimer <= 0 && this.hips.position.y < platformHeight + 2.5) {
                        if(this.isPlayer || Math.random()<0.05) this.setRagdoll(false);
                    }
                    return;
                }

                this.walkTime += speed * 10;
                this.position.x = this.hips.position.x; this.position.z = this.hips.position.z;
                
                if(this.punching>0) { this.punching -= dt*4; if(this.punching<0) this.punching=0; }
                if(this.kicking>0) { this.kicking -= dt*3; if(this.kicking<0) this.kicking=0; }

                const setPart = (body, x, y, z, rotX=0) => {
                    const v = new THREE.Vector3(x, y, z);
                    v.applyAxisAngle(new THREE.Vector3(0,1,0), this.rotation);
                    body.position.set(this.position.x + v.x, this.position.y + v.y + platformHeight + 9, this.position.z + v.z);
                    body.quaternion.setFromEuler(rotX, this.rotation, 0);
                };

                const s = Math.sin(this.walkTime), c = Math.cos(this.walkTime), sw = speed > 0;
                let lLegRot = sw ? s*0.8 : 0, rLegRot = sw ? -s*0.8 : 0;
                let lArmRot = sw ? c*0.5 : 0, rArmRot = sw ? -c*0.5 : 0;
                
                if(this.blocking) { lArmRot = -1.5; rArmRot = -1.5; }
                
                let torsoRot = this.recoil > 0 ? -0.5 * this.recoil : 0;
                
                if (this.headbutting > 0) {
                    const ext = Math.sin(this.headbutting * Math.PI);
                    torsoRot -= ext * 0.5;
                }

                this.torso.quaternion.setFromEuler(torsoRot, this.rotation, 0);
                this.head.quaternion.setFromEuler(torsoRot * 1.2, this.rotation, 0);
                
                if (this.headbutting > 0) {
                     const ext = Math.sin(this.headbutting * Math.PI);
                     const fwd = new THREE.Vector3(0,0,-1).applyAxisAngle(new THREE.Vector3(0,1,0), this.rotation);
                     const base = new THREE.Vector3(0, 6.5, 0).applyAxisAngle(new THREE.Vector3(0,1,0), this.rotation);
                     const headPos = base.add(fwd.multiplyScalar(-ext * 2.5)); 
                     this.head.position.set(this.position.x + headPos.x, this.position.y + headPos.y + platformHeight + 9, this.position.z + headPos.z);
                }


                this.lLegU.quaternion.setFromEuler(lLegRot, this.rotation, 0);
                this.lLegL.quaternion.setFromEuler(lLegRot + (s>0?0.5:0), this.rotation, 0);
                this.rLegU.quaternion.setFromEuler(rLegRot, this.rotation, 0);
                this.rLegL.quaternion.setFromEuler(rLegRot + (s<0?0.5:0), this.rotation, 0);
                this.lArmU.quaternion.setFromEuler(lArmRot, this.rotation, 0);
                
                if(this.blocking) {
                    setPart(this.lArmU, 2.5, 2.5, 1.5); setPart(this.lArmL, 2.5, 4.5, 1.5);
                    if(this.punching<=0) {
                        this.rArmU.quaternion.setFromEuler(rArmRot, this.rotation, 0);
                        setPart(this.rArmU, -2.5, 2.5, 1.5); setPart(this.rArmL, -2.5, 4.5, 1.5);
                    }
                } else {
                    setPart(this.lArmU, 2.8, 3, 0, lArmRot); setPart(this.lArmL, 2.8, -0.5, sw?s:0, lArmRot);
                    if(this.punching<=0) {
                        setPart(this.rArmU, -2.8, 3, 0, rArmRot); setPart(this.rArmL, -2.8, -0.5, sw?-s:0, rArmRot);
                    }
                }

                if(this.kicking > 0) {
                    const ext = Math.sin(this.kicking * Math.PI);
                    const fwd = new THREE.Vector3(0,0,-1).applyAxisAngle(new THREE.Vector3(0,1,0), this.rotation);
                    const base = new THREE.Vector3(-1, -3.5, 0).applyAxisAngle(new THREE.Vector3(0,1,0), this.rotation);
                    const k = base.add(fwd.multiplyScalar(ext*5));
                    k.y += ext*4;
                    this.rLegU.position.set(this.position.x+k.x, this.position.y+k.y+platformHeight+9, this.position.z+k.z);
                    this.rLegU.quaternion.setFromEuler(-Math.PI/2*ext, this.rotation, 0);
                    const k2 = k.clone().add(fwd.clone().multiplyScalar(3));
                    this.rLegL.position.set(this.position.x+k2.x, this.position.y+k2.y+platformHeight+9, this.position.z+k2.z);
                    this.rLegL.quaternion.setFromEuler(-Math.PI/2*ext, this.rotation, 0);
                } else {
                    setPart(this.rLegU, -1, -3.5, 0, rLegRot); 
                    setPart(this.rLegL, -1, -8, sw?rLegRot*2:0, rLegRot);
                }

                if(this.punching > 0) {
                     const ext = Math.sin(this.punching * Math.PI);
                     const fwd = new THREE.Vector3(0,0,-1).applyAxisAngle(new THREE.Vector3(0,1,0), this.rotation);
                     const base = new THREE.Vector3(-2.8, 3, 0).applyAxisAngle(new THREE.Vector3(0,1,0), this.rotation);
                     const p = base.add(fwd.multiplyScalar(ext*4));
                     
                     this.rArmU.position.set(this.position.x+p.x, this.position.y+p.y+platformHeight+9, this.position.z+p.z);
                     this.rArmU.quaternion.setFromEuler(-Math.PI/2, this.rotation, 0);
                     
                     const p2 = p.clone().add(fwd.clone().multiplyScalar(2));
                     this.rArmL.position.set(this.position.x+p2.x, this.position.y+p2.y+platformHeight+9, this.position.z+p2.z);
                     this.rArmL.quaternion.setFromEuler(-Math.PI/2, this.rotation, 0);
                } else {
                     setPart(this.rArmU, -2.8, 3, 0, rArmRot);
                     setPart(this.rArmL, -2.8, -0.5, sw ? -s : 0, rArmRot);
                }

                setPart(this.lLegU, 1, -3.5, 0, lLegRot); 
                setPart(this.lLegL, 1, -8, sw?lLegRot*2:0, lLegRot);

                setPart(this.torso, 0, 2.5, 0, torsoRot);
                if (this.headbutting <= 0) {
                    setPart(this.head, 0, 6.5, 0, torsoRot*1.2);
                }
            }
        }

        // --- 7. LOOP ---
        const player = new Human(10, 0, "#00ff88", true);
        const npcs = [ new Human(-10, 0, "#ff0055") ];
        const keys = { w:false, a:false, s:false, d:false, f:false, shift:false, e:false };

        window.addEventListener('keydown', e => {
            if(spectateMode) return; 
            const key = e.key.toLowerCase();
            if(keys.hasOwnProperty(key)) keys[key] = true;
            if(e.code === 'ShiftLeft') player.startBlock();
            if(e.code === 'Space') player.jump();
            if(e.code === 'KeyE') player.grab();
            if(e.code === 'KeyF') player.headbutt(); 
        });
        window.addEventListener('keyup', e => {
            const key = e.key.toLowerCase();
            if(keys.hasOwnProperty(key)) keys[key] = false;
            if(e.code === 'ShiftLeft') player.blocking = false;
        });
        window.addEventListener('mousedown', e => {
            if(spectateMode || player.isDead) return;
            if(e.button === 0) player.punch();
            if(e.button === 2) player.kick();
        });
        window.addEventListener('contextmenu', e => e.preventDefault());
        window.addEventListener('keydown', e => { if(e.key === 'r') location.reload(); });

        const clock = new THREE.Clock();
        let lastPlayerAITime = 0; 

        function animate() {
            requestAnimationFrame(animate);
            const dt = Math.min(clock.getDelta(), 0.05); 
            world.step(1/60, dt, 5); 

            if(screenShake > 0) {
                screenShake -= dt;
                const shake = screenShake * 2;
                camera.position.x += (Math.random()-0.5)*shake;
                camera.position.y += (Math.random()-0.5)*shake;
                camera.position.z += (Math.random()-0.5)*shake;
            }

            updateParticles();
            if (chatBubbleMesh) {
                const character = chatBubbleMesh.userData.character;
                if (character) {
                    const headPosition = character.head.position;
                    // Keep the bubble positioned correctly above the head
                    chatBubbleMesh.position.set(headPosition.x, headPosition.y + 5, headPosition.z);
                    // Keep the bubble facing the camera (Billboarding)
                    chatBubbleMesh.rotation.y = camera.rotation.y;
                }
            }

            // --- AI & Player Control ---

            const targetNPC = npcs[0];

            if (spectateMode) {
                // Player is AI (Green Guy) targeting NPC
                if (!player.isDead) {
                    player.updateAI(dt, targetNPC);
                } else {
                    player.update(dt, 0);
                }
            } else {
                // Player is human-controlled
                if(!player.isRagdoll && !player.isDead) {
                    const speed = 20, rotSpeed = 3;
                    const mod = (player.punching>0 || player.kicking>0 || player.blocking || player.headbutting>0) ? 0.2 : 1;
                    if(keys.a) player.rotation += rotSpeed*dt;
                    if(keys.d) player.rotation -= rotSpeed*dt;
                    const fwd = new THREE.Vector3(0,0,-1).applyAxisAngle(new THREE.Vector3(0,1,0), player.rotation);
                    let moving = false;
                    if(keys.w) { player.hips.position.x += fwd.x*speed*mod*dt; player.hips.position.z += fwd.z*speed*mod*dt; moving = true; }
                    if(keys.s) { player.hips.position.x -= fwd.x*speed*mod*dt; player.hips.position.z -= fwd.z*speed*mod*dt; moving = true; }
                    player.update(dt, moving?1:0);
                } else player.update(dt, 0);
            }

            // NPC Control (Red Guy) targeting Player
            if(targetNPC.isDead) { targetNPC.update(dt,0); }
            else if(targetNPC.isRagdoll) {
                targetNPC.update(dt,0);
                if(targetNPC.hips.position.y < 0) { targetNPC.setRagdoll(false); targetNPC.hips.position.set(-10, 20, 0); }
            } else {
                 if(targetNPC.isStunned) { targetNPC.update(dt, 0); }
                 else { targetNPC.updateAI(dt, player); } // NPC fights back
            }

            // Check boundaries and reset if needed
            [player, ...npcs].forEach(c => {
                if(!c.isRagdoll) {
                    if(c.hips.position.y < platformHeight + 0.1 || c.hips.position.length() > 35) { 
                        c.setRagdoll(true); // Temporary ragdoll
                        c.hips.position.set(0, platformHeight + 20, 0); 
                    }
                }
            });

            // Camera Logic
            let targetPos;
            if (spectateMode) {
                const p1 = player.hips.position;
                const p2 = targetNPC.hips.position;
                targetPos = new THREE.Vector3((p1.x+p2.x)/2, (p1.y+p2.y)/2, (p1.z+p2.z)/2);
            } else {
                targetPos = new THREE.Vector3(player.hips.position.x, player.hips.position.y, player.hips.position.z);
            }

            const off = new THREE.Vector3(0, 40, 60);
            if (!spectateMode) off.applyAxisAngle(new THREE.Vector3(0,1,0), player.rotation*0.1);
            
            if(player.hips.position.distanceTo(targetNPC.hips.position) < 15) off.multiplyScalar(0.6);
            camera.position.lerp(targetPos.clone().add(off), 0.1);
            camera.lookAt(targetPos);

            renderer.render(scene, camera);
        }
        window.addEventListener('resize', () => { camera.aspect = window.innerWidth/window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); });
        animate();

<script>

   v3: twin-stick support — left stick moves, right stick aims/looks —

   Config: window.BIT_MOBILE = {

     rightStick:'look'|'aim'|null,          // right stick behavior
     aimFire:true,                          // aim stick fires past 55% push

(function () {
  var cfg = window.BIT_MOBILE || {};
  var isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;

  /* ---- lock spoofing for pointer-lock-gated games (mobile has no real lock) ---- */

  setTimeout(armLocks, 600); setTimeout(armLocks, 2000);

  var style = document.createElement('style');
  style.textContent = [
    'html,body{touch-action:none;overscroll-behavior:none}',
    '#bit-kit{position:fixed;inset:0;z-index:2147483000;pointer-events:none;font-family:sans-serif}',
    '#bit-ui{transition:opacity .45s ease}',
    '#bit-kit.bit-idle #bit-ui{opacity:.22}',
    '#bit-kit.bit-hidden #bit-ui{display:none}',
    '.bit-stick{position:absolute;width:92px;height:92px;border-radius:50%;',
    'background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.22);pointer-events:auto}',
    '#bit-stickL{left:12px;bottom:16px}',
    '#bit-stickR{right:12px;bottom:16px}',
    '.bit-nub{position:absolute;left:50%;top:50%;width:40px;height:40px;border-radius:50%;',
    'background:rgba(255,255,255,.30);transform:translate(-50%,-50%)}',
    '#bit-btns{position:absolute;display:flex;flex-direction:column;gap:8px;pointer-events:auto;align-items:flex-end}',
    '#bit-btns.slot-aboveR{right:14px;bottom:122px}',
    '#bit-btns.slot-midR{right:10px;top:50%;transform:translateY(-50%)}',
    '#bit-btns.slot-topR{right:10px;top:54px}',
    '.bit-btn{min-width:50px;height:42px;padding:0 10px;border-radius:13px;border:1.5px solid rgba(255,255,255,.22);',
    'background:rgba(20,20,40,.38);color:rgba(255,255,255,.85);font-size:13px;font-weight:700;text-align:center}',
    '.bit-btn:active{background:rgba(255,159,243,.45)}',
    '#bit-toggle{position:absolute;right:10px;top:8px;width:36px;height:36px;border-radius:50%;pointer-events:auto;',
    'border:1.5px solid rgba(255,255,255,.25);background:rgba(20,20,40,.40);color:#fff;font-size:16px;line-height:1;',
    'display:flex;align-items:center;justify-content:center;opacity:.55}'
  ].join('');
  document.head.appendChild(style);

  var KEYMAP = {
    KeyW: ['w', 87], KeyA: ['a', 65], KeyS: ['s', 83], KeyD: ['d', 68], KeyE: ['e', 69],
    KeyF: ['f', 70], KeyG: ['g', 71], KeyR: ['r', 82], Space: [' ', 32], KeyM: ['m', 77], KeyT: ['t', 84],
    ShiftLeft: ['Shift', 16], ArrowUp: ['ArrowUp', 38], ArrowDown: ['ArrowDown', 40], ArrowLeft: ['ArrowLeft', 37], ArrowRight: ['ArrowRight', 39]
  };
  function fireKey(type, code) {
    var m = KEYMAP[code] || [code.replace('Key', '').toLowerCase(), 0];
    var e = new KeyboardEvent(type, { code: code, key: m[0], bubbles: true, cancelable: true });
    try { Object.defineProperty(e, 'keyCode', { value: m[1] }); Object.defineProperty(e, 'which', { value: m[1] }); } catch (err) {}

    var e = new MouseEvent(type, { bubbles: true, cancelable: true, clientX: x, clientY: y, button: btn || 0 });

    t.dispatchEvent(e); document.dispatchEvent(e); window.dispatchEvent(e);

    if (cfg.look === 'bitlook') window.dispatchEvent(new CustomEvent('bitlook', { detail: { dx: dx, dy: dy } }));
    else if (cfg.look === 'mouse') fireMouse('mousemove', window.innerWidth / 2, window.innerHeight / 2, dx, dy);
  }

  var ui = document.createElement('div'); ui.id = 'bit-ui';

  var idleTimer = null;

  function makeStick(id) {

    }, { passive: false });

        st.nub.style.transform = 'translate(calc(-50% + ' + dx * 25 + 'px), calc(-50% + ' + dy * 25 + 'px))';
        onMove(dx, dy);

    }, { passive: false });
    function end(e) {
      for (var i = 0; i < e.changedTouches.length; i++) if (e.changedTouches[i].identifier === st.tid) {

  var pressed = {};
  function setKey(code, down) {
    if (pressed[code] === down) return; pressed[code] = down;

  }
  if (cfg.move) {
    var g = cfg.move === 'both'
      ? [['KeyW', 'ArrowUp'], ['KeyS', 'ArrowDown'], ['KeyA', 'ArrowLeft'], ['KeyD', 'ArrowRight']]

  if (cfg.rightStick) {

  if (cfg.buttons && cfg.buttons.length) {
    var wrap = document.createElement('div'); wrap.id = 'bit-btns';

    if (!cfg.rightStick && !cfg.btnSlot) { wrap.style.right = '10px'; wrap.style.bottom = '16px'; }

  if ((cfg.look && cfg.look !== 'none' && !cfg.rightStick) || cfg.bridge) {
    var lookId = null, lx = 0, ly = 0, locked = false;
    document.addEventListener('touchstart', function (e) {

  }
})();
