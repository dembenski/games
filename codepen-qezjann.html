        function findSpawnPoints(grid) {
            const points = [];
            for (let y = 1; y < MAP_HEIGHT - 1; y += 2) { 
                for (let x = 1; x < MAP_WIDTH - 1; x += 2) {
                    if (grid[y][x] === 0) {
                        points.push(new THREE.Vector3(x * CELL_SIZE + CELL_SIZE / 2, WALL_HEIGHT / 2, y * CELL_SIZE + CELL_SIZE / 2));
                    }
                }
            }
            return points;
        }

        function spawnEnemy() {
            if (spawnPoints.length === 0) return;

            const randomIndex = Math.floor(Math.random() * spawnPoints.length);
            const spawnPos = spawnPoints[randomIndex].clone();
            
            if (playerObject && spawnPos.distanceTo(playerObject.position) < CELL_SIZE * 10) return;

            const newEnemy = new Enemy(spawnPos);
            enemies.push(newEnemy);
        }

        // --- FIXED: Connected Maze Generation (DFS) ---
        function generateMap() {
            const grid = Array(MAP_HEIGHT).fill(0).map(() => Array(MAP_WIDTH).fill(1)); 
            
            const stack = [];
            
            const startX = 1;
            const startY = 1;
            grid[startY][startX] = 0;
            stack.push({x: startX, y: startY});
            
            while(stack.length > 0) {
                const current = stack.pop();
                const x = current.x;
                const y = current.y;
                
                const neighbors = [];
                const dirs = [[0, -2], [0, 2], [-2, 0], [2, 0]];
                
                for(let i=0; i<dirs.length; i++) {
                    const nx = x + dirs[i][0];
                    const ny = y + dirs[i][1];
                    
                    if(nx > 0 && nx < MAP_WIDTH-1 && ny > 0 && ny < MAP_HEIGHT-1) {
                        if(grid[ny][nx] === 1) {
                            neighbors.push({x: nx, y: ny, dir: dirs[i]});
                        }
                    }
                }
                
                if(neighbors.length > 0) {
                    stack.push({x: x, y: y}); 
                    const chosen = neighbors[Math.floor(Math.random() * neighbors.length)];
                    const wallX = x + (chosen.dir[0] / 2);
                    const wallY = y + (chosen.dir[1] / 2);
                    grid[wallY][wallX] = 0;
                    grid[chosen.y][chosen.x] = 0;
                    stack.push({x: chosen.x, y: chosen.y});
                }
            }
            
            for (let y = 1; y < MAP_HEIGHT - 1; y++) {
                for (let x = 1; x < MAP_WIDTH - 1; x++) {
                    if (grid[y][x] === 1) {
                        if ((grid[y][x - 1] === 0 && grid[y][x + 1] === 0 && grid[y - 1][x] === 1 && grid[y + 1][x] === 1) || 
                            (grid[y - 1][x] === 0 && grid[y + 1][x] === 0 && grid[y][x - 1] === 1 && grid[y][x + 1] === 1)) {
                            if (Math.random() < 0.05) { 
                                grid[y][x] = 2; // Door
                            }
                        }
                    }
                }
            }

            return grid;
        }

        function createCheckerboardTexture() {
            const size = 16;
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const context = canvas.getContext('2d');
            const color1 = currentFloorColor1;
            const color2 = currentFloorColor2;
            const tile_size = 8; 

            for (let y = 0; y < size; y++) {
                for (let x = 0; x < size; x++) {
                    const is_x_odd = Math.floor(x / tile_size) % 2;
                    const is_y_odd = Math.floor(y / tile_size) % 2;
                    context.fillStyle = (is_x_odd !== is_y_odd) ? color1 : color2;
                    context.fillRect(x, y, 1, 1);
                }
            }
            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = THREE.RepeatWrapping;
            texture.wrapT = THREE.RepeatWrapping;
            texture.repeat.set(MAP_WIDTH, MAP_HEIGHT); 
            texture.magFilter = THREE.NearestFilter; 
            return texture;
        }

        function createWallTexture() {
            const size = 32;
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const context = canvas.getContext('2d');
            const baseColor = currentWallColor1;
            const panelLineColor = '#101010';
            const grimeColor = currentWallColor2;

            context.fillStyle = baseColor;
            context.fillRect(0, 0, size, size);
            context.fillStyle = panelLineColor;
            context.fillRect(0, 0, size, 2);
            context.fillRect(0, size - 2, size, 2);
            context.fillRect(0, size / 2 - 1, size, 2);

            for (let i = 0; i < 10; i++) {
                context.fillStyle = grimeColor;
                const x = Math.floor(Math.random() * size);
                const y = Math.floor(Math.random() * size);
                context.fillRect(x, y, 2, 2);
            }

            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = THREE.RepeatWrapping;
            texture.wrapT = THREE.RepeatWrapping;
            texture.repeat.set(1, 1); 
            texture.magFilter = THREE.NearestFilter;
            return texture;
        }

        function create3DMap(grid) {
            let wallMaterial, floorMaterial, ceilingMaterial;

            if (useHDTextures) {
                // HD MODE
                const brickTex = createHDBrickTexture();
                wallMaterial = new THREE.MeshPhongMaterial({ map: brickTex, side: THREE.DoubleSide });
                
                const grassTex = createHDGrassTexture();
                floorMaterial = new THREE.MeshPhongMaterial({ map: grassTex, side: THREE.DoubleSide });
                
                const concreteTex = createHDConcreteTexture();
                ceilingMaterial = new THREE.MeshPhongMaterial({ map: concreteTex, side: THREE.DoubleSide });
                
            } else {
                // RETRO MODE
                const wallTexture = createWallTexture();
                wallMaterial = new THREE.MeshPhongMaterial({ 
                    color: 0x888888, map: wallTexture, side: THREE.DoubleSide 
                }); 
                const floorTexture = createCheckerboardTexture();
                floorMaterial = new THREE.MeshPhongMaterial({ map: floorTexture, specular: 0x000000 }); 
                ceilingMaterial = new THREE.MeshPhongMaterial({ color: 0x666666, specular: 0x000000 }); 
            }

            const doorMaterial = new THREE.MeshPhongMaterial({ 
                color: 0xAA2222, side: THREE.DoubleSide, emissive: 0x440000, flatShading: true 
            }); 
            const geometry = new THREE.BoxGeometry(CELL_SIZE, WALL_HEIGHT, CELL_SIZE);

            const floorGeometry = new THREE.PlaneGeometry(MAP_WIDTH * CELL_SIZE, MAP_HEIGHT * CELL_SIZE);
            const floor = new THREE.Mesh(floorGeometry, floorMaterial);
            floor.rotation.x = -Math.PI / 2;
            floor.position.x = (MAP_WIDTH * CELL_SIZE) / 2;
            floor.position.y = 0;
            floor.position.z = (MAP_HEIGHT * CELL_SIZE) / 2;
            floor.receiveShadow = true;
            scene.add(floor);

            const ceiling = new THREE.Mesh(floorGeometry, ceilingMaterial);
            ceiling.rotation.x = Math.PI / 2;
            ceiling.position.x = (MAP_WIDTH * CELL_SIZE) / 2;
            ceiling.position.y = WALL_HEIGHT;
            ceiling.position.z = (MAP_HEIGHT * CELL_SIZE) / 2;
            scene.add(ceiling);

            for (let y = 0; y < MAP_HEIGHT; y++) {
                for (let x = 0; x < MAP_WIDTH; x++) {
                    const cellType = grid[y][x];
                    if (cellType === 1 || cellType === 2) {
                        const material = (cellType === 2) ? doorMaterial : wallMaterial;
                        const wall = new THREE.Mesh(geometry, material);
                        wall.position.x = x * CELL_SIZE + CELL_SIZE / 2;
                        wall.position.y = WALL_HEIGHT / 2;
                        wall.position.z = y * CELL_SIZE + CELL_SIZE / 2;
                        
                        wall.userData = { 
                            isDoor: (cellType === 2),
                            isClosed: (cellType === 2), 
                            gridX: x,
                            gridY: y,
                            animationStartTime: 0,
                            openHeight: WALL_HEIGHT + CELL_SIZE * 0.5 
                        };
                        scene.add(wall);
                        collidableObjects.push(wall);
                    }
                }
            }
        }

        // --- Door Interaction Logic ---

        function openDoor(doorMesh) {
            if (!doorMesh.userData.isClosed) return;

            doorMesh.userData.isClosed = false;
            doorMesh.userData.animationStartTime = performance.now();
            animatingDoors.push(doorMesh);

            collidableObjects = collidableObjects.filter(obj => obj !== doorMesh);
            showMessage("Door opened!", 1500);
        }

        // --- Dedicated Shoot Function (LMB) ---
        function handleShoot() {
            if (isGameOver) return;

            if (playerStats.ammo <= 0) {
                showMessage("CLICK! Out of Ammo!", 1000);
                return; 
            }
            playerStats.ammo--;
            
            showMessage("FIRE!", 500);
            playShootSound();

            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
            raycaster.far = CELL_SIZE * 20; 

            const interactionTargets = enemies.map(e => e.mesh);
            const intersections = raycaster.intersectObjects(interactionTargets, true); 

            if (intersections.length > 0) {
                const object = intersections[0].object;
                
                let hitEnemyMesh = object;
                while (hitEnemyMesh && !hitEnemyMesh.userData.isEnemy && hitEnemyMesh.parent !== scene) {
                    hitEnemyMesh = hitEnemyMesh.parent;
                }

                if (hitEnemyMesh && hitEnemyMesh.userData.isEnemy) {
                    hitEnemyMesh.userData.parent.takeDamage(50); 
                    showMessage("HIT! -50", 800);
                }
            } 

            gunSVG.style.transform = 'translateY(10px)';
            setTimeout(() => {
                gunSVG.style.transform = 'translateY(0)';
            }, 50);

            updateHUD();
        }

        function handleDoorInteraction() {
            if (isGameOver) return;
            
            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
            raycaster.far = CELL_SIZE * 5; 

            const intersections = raycaster.intersectObjects(collidableObjects, true); 

            if (intersections.length > 0) {
                const object = intersections[0].object;
                if (object.userData.isDoor) {
                    openDoor(object);
                }
            }
        }


        function updateDoorAnimations(delta) {
            const now = performance.now();
            const doorsToRemove = [];

            for (let i = 0; i < animatingDoors.length; i++) {
                const door = animatingDoors[i];
                const elapsed = (now - door.userData.animationStartTime) / 1000;
                const progress = Math.min(1, elapsed / DOOR_OPEN_TIME);
                
                const startY = WALL_HEIGHT / 2;
                const endY = door.userData.openHeight; 
                
                door.position.y = startY + (endY - startY) * progress;

                if (progress >= 1) {
                    doorsToRemove.push(i);
                }
            }
            
            for (let i = doorsToRemove.length - 1; i >= 0; i--) {
                animatingDoors.splice(doorsToRemove[i], 1);
            }
        }

        function updateHealthBars() {
            const vector = new THREE.Vector3(); 
            camera.updateMatrixWorld();
            camera.updateProjectionMatrix();

            enemies.forEach(enemy => {
                const enemyMesh = enemy.mesh;
                const healthBarContainer = enemy.healthBar.container;

                vector.copy(enemyMesh.position);
                vector.y = WALL_HEIGHT * 0.8 + 0.5; 
                
                vector.project(camera); 

                if (vector.z > 1 || vector.x < -1 || vector.x > 1 || vector.y < -1 || vector.y > 1) {
                    healthBarContainer.style.display = 'none';
                    return;
                }

                const x = (vector.x * 0.5 + 0.5) * window.innerWidth;
                const y = (-vector.y * 0.5 + 0.5) * window.innerHeight;

                healthBarContainer.style.display = 'block';
                healthBarContainer.style.left = `${x}px`;
                healthBarContainer.style.top = `${y}px`;
            });
        }


        // --- Controls and Interaction ---

        function setupControls() {
            // Pointer lock interactions handled via Start/Respawn buttons now for robustness
            
            document.addEventListener('pointerlockchange', () => {
                if (document.pointerLockElement === pointerLockElement) {
                    overlay.style.display = 'none';
                    startDoomMusic(); 
                } else {
                    if (!isGameOver) {
                        // Show the overlay when lock is released (e.g., by ESC key)
                        overlay.style.display = 'flex';
                        // Hide custom panels and show main menu
                        generatorPanel.style.display = 'none';
                        startMenu.style.display = 'block';
                    }
                }
            });

            document.addEventListener('mousemove', (event) => {
                if (document.pointerLockElement === pointerLockElement) {
                    const movementX = event.movementX || 0;
                    const movementY = event.movementY || 0;

                    playerObject.rotation.y -= movementX * 0.002; 
                    
                    let pitch = camera.rotation.x - movementY * 0.002;
                    pitch = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, pitch));
                    camera.rotation.x = pitch;
                }
            });
            
            document.addEventListener('mousedown', (event) => {
                if (document.pointerLockElement === pointerLockElement) {
                    if (event.button === 0) {
                        handleShoot(); 
                    }
                    if (event.button === 2) { 
                        event.preventDefault(); 
                    }
                }
            });


            const onKeyDown = (event) => {
                if (document.pointerLockElement === pointerLockElement) {
                    switch (event.code) {
                        case 'KeyW': moveForward = true; break;
                        case 'KeyA': moveLeft = true; break;
                        case 'KeyS': moveBackward = true; break;
                        case 'KeyD': moveRight = true; break;
                        case 'KeyE': 
                            handleDoorInteraction(); 
                            break;
                    }
                }
            };

            const onKeyUp = (event) => {
                switch (event.code) {
                    case 'KeyW': moveForward = false; break;
                    case 'KeyA': moveLeft = false; break;
                    case 'KeyS': moveBackward = false; break;
                    case 'KeyD': moveRight = false; break;
                }
            };

            document.addEventListener('keydown', onKeyDown);
            document.addEventListener('keyup', onKeyUp);
        }

        // --- Game Loop and Physics ---

        function updatePhysics(delta) {
            if (isGameOver) return; // Prevent player movement if game over

            const isMoving = moveForward || moveBackward || moveLeft || moveRight;

            // --- Running Sound Logic ---
            if (isMoving && !isRunningSoundPlaying) {
                runningLoop.start();
                isRunningSoundPlaying = true;
            } else if (!isMoving && isRunningSoundPlaying) {
                runningLoop.stop();
                isRunningSoundPlaying = false;
            }
            // --- End Running Sound Logic ---

            if (document.pointerLockElement === pointerLockElement) {
                const moveSpeed = 8 * delta * CELL_SIZE;

                playerVelocity.set(0, 0, 0);

                const direction = new THREE.Vector3();
                playerObject.getWorldDirection(direction);
                direction.y = 0;
                direction.normalize();

                const right = new THREE.Vector3().crossVectors(new THREE.Vector3(0, 1, 0), direction);

                if (moveForward) playerVelocity.sub(direction.clone().multiplyScalar(moveSpeed));
                if (moveBackward) playerVelocity.add(direction.clone().multiplyScalar(moveSpeed));
                
                if (moveLeft) playerVelocity.sub(right.clone().multiplyScalar(moveSpeed));
                if (moveRight) playerVelocity.add(right.clone().multiplyScalar(moveSpeed));

                const step = playerVelocity.length();
                if (step > 0.01) {
                    const normalizedVelocity = playerVelocity.clone().normalize();
                    
                    const collisionTargets = collidableObjects.concat(enemies.map(e => e.mesh));

                    const raycaster = new THREE.Raycaster(playerObject.position, normalizedVelocity, 0, step + 0.5);
                    const intersections = raycaster.intersectObjects(collisionTargets);

                    if (intersections.length === 0) {
                        playerObject.position.add(playerVelocity);
                    }
                }

                playerObject.position.y = WALL_HEIGHT / 2;
            }
        }
        
        function updateEnemies(delta) {
            enemies.forEach(enemy => enemy.update(delta));
        }

        function animate() {
            requestAnimationFrame(animate);
            
            const time = performance.now();
            const delta = (time - lastTime) / 1000;
            lastTime = time;

            if (!isGameOver) {
                // --- AI Update Throttling ---
                // Update the AI Flow Field every 250ms so they track the player efficiently
                if (time - lastFlowFieldUpdate > 250) {
                    updateEnemyFlowField();
                    lastFlowFieldUpdate = time;
                }
                
                if (document.pointerLockElement === pointerLockElement) {
                    updatePhysics(delta);
                    updateDoorAnimations(delta); 
                    updateEnemies(delta); 
                    checkPickupCollision(); 
                    checkDiamondCollision();
                    checkExitCollision(); // Check for victory
                }
                
                if (healthPackObject) {
                    healthPackObject.rotation.y += 0.01;
                    healthPackObject.rotation.x += 0.005;
                }
                if (exitPortalObject) { // Animate exit portal
                    exitPortalObject.rotation.y += 0.02;
                }
            }
            
            updateHealthBars(); 
            drawMinimap();
            renderer.render(scene, camera);
        }

        // Start everything when the window loads
        window.onload = function() {
            initThree();
            animate();
        };

    </script>
