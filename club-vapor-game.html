<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CLUB VAPOR — The Game (walk • drive • 40 coins)</title>
<style>
  html, body { margin:0; padding:0; overflow:hidden; background:#07040f; height:100%;
    font-family: 'Segoe UI', system-ui, sans-serif; }
  #app { position:fixed; inset:0; }
  canvas { display:block; }
  #hud { position:fixed; left:14px; top:12px; z-index:10; color:#fff; pointer-events:none;
    text-shadow:0 0 12px #ff2d95, 0 0 3px #ff2d95; }
  #hud h1 { margin:0; font-size:22px; letter-spacing:3px; font-weight:800; }
  #hud p { margin:3px 0 0 1px; font-size:12px; color:#cfe9ff; text-shadow:0 0 8px #22d3ee; letter-spacing:1px;}
  #nav { position:fixed; left:50%; bottom:16px; transform:translateX(-50%); z-index:10; display:flex; gap:10px; }
  #nav button { pointer-events:auto; cursor:pointer; font-size:14px; font-weight:700; letter-spacing:1px;
    color:#fff; background:rgba(20,8,36,0.85); border:1px solid #ff2d95; border-radius:999px; padding:9px 18px;
    box-shadow:0 0 14px rgba(255,45,149,0.55), inset 0 0 8px rgba(255,45,149,0.25); }
  #nav button:last-child { border-color:#22d3ee; box-shadow:0 0 14px rgba(34,211,238,0.55), inset 0 0 8px rgba(34,211,238,0.25); }
  #nav button:active { transform:scale(0.96); }
  #score { position:fixed; right:14px; top:12px; z-index:10; color:#fff; text-align:right; pointer-events:none;
    font-weight:800; letter-spacing:1px; text-shadow:0 0 12px #facc15, 0 0 3px #000; font-size:17px; }
  #score small { display:block; font-size:11px; color:#cfe9ff; text-shadow:0 0 8px #22d3ee; font-weight:700; margin-top:2px;}
  #prompt { position:fixed; left:50%; bottom:86px; transform:translateX(-50%); z-index:10; color:#fff;
    background:rgba(20,8,36,0.88); border:1px solid #facc15; border-radius:999px; padding:8px 18px;
    font-size:14px; font-weight:700; letter-spacing:0.5px; display:none; box-shadow:0 0 14px rgba(250,204,21,0.5); }
  #banner { position:fixed; left:50%; top:22%; transform:translateX(-50%); z-index:11; color:#fff; text-align:center;
    font-size:30px; font-weight:900; letter-spacing:2px; display:none; pointer-events:none;
    text-shadow:0 0 18px #ff2d95, 0 0 6px #ff2d95, 0 2px 2px #000; }
  #stick { position:fixed; left:22px; bottom:74px; width:118px; height:118px; z-index:10; border-radius:50%;
    border:2px solid rgba(34,211,238,0.6); background:rgba(10,6,24,0.4); display:none; touch-action:none; }
  #stickKnob { position:absolute; left:50%; top:50%; width:52px; height:52px; border-radius:50%;
    background:rgba(34,211,238,0.55); transform:translate(-50%,-50%); box-shadow:0 0 12px rgba(34,211,238,0.8); }
  #btnDrive { position:fixed; right:22px; bottom:84px; z-index:10; display:none; cursor:pointer;
    font-size:15px; font-weight:800; letter-spacing:1px; color:#fff; background:rgba(20,8,36,0.88);
    border:1px solid #facc15; border-radius:999px; padding:12px 20px; box-shadow:0 0 14px rgba(250,204,21,0.55); }
</style>
<script type="importmap">
{ "imports": {
  "three": "./three.module.js",
  "three/addons/": "./"
} }
</script>
</head>
<body>
<div id="app"></div>
<div id="hud"><h1>CLUB VAPOR</h1><p>WASD / joystick to walk &bull; drag or mouse to look &bull; E to hop in a car &bull; grab every coin in the club + city!</p></div>
<div id="score">&#129689; 0/30<small>SCORE 0</small></div>
<div id="prompt"></div>
<div id="banner"></div>
<div id="stick"><div id="stickKnob"></div></div>
<button id="btnDrive">&#128663; DRIVE</button>
<div id="nav">
  <button id="btnEnter">&#128682; Enter the club</button>
  <button id="btnStreet">&#127747; Back to the street</button>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/OrbitControls.js';

const PALETTE = [0xff2d95, 0x22d3ee, 0x8b5cf6, 0xa3e635, 0xfb923c, 0x60a5fa, 0xfacc15];
const PALETTE_CSS = ['#ff2d95','#22d3ee','#8b5cf6','#a3e635','#fb923c','#60a5fa','#facc15'];

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x07040f);
scene.fog = new THREE.Fog(0x0a0618, 30, 175);

const camera = new THREE.PerspectiveCamera(62, innerWidth/innerHeight, 0.1, 120);
camera.position.set(13, 3.4, 32);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.getElementById('app').appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 4, 10);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.maxDistance = 85;
controls.maxPolarAngle = Math.PI * 0.55;
controls.autoRotate = false;
controls.enabled = false; // the game drives the camera; OrbitControls only wakes up for screenshot free-cam
const solids = []; // AABB colliders {x1,x2,z1,z2} filled by builders + the game section

// ---------- lights ----------
scene.add(new THREE.AmbientLight(0x4a3577, 0.9));
const hemi = new THREE.HemisphereLight(0x8b5cf6, 0x0b0618, 0.5); scene.add(hemi);
const stageLight = new THREE.PointLight(0xff2d95, 220, 30, 1.8); stageLight.position.set(0, 6, -8); scene.add(stageLight);
const barLight   = new THREE.PointLight(0x22d3ee, 160, 26, 1.8); barLight.position.set(12, 4.5, 0); scene.add(barLight);
const loungeLight = new THREE.PointLight(0x8b5cf6, 150, 22, 1.8); loungeLight.position.set(-11.5, 5.5, -1); scene.add(loungeLight);
const danceLight = new THREE.PointLight(0xb18cff, 120, 24, 1.8); danceLight.position.set(0, 7.5, 0); scene.add(danceLight);
// club spotlights + strobe (driven by the lighting engine in animate)
const spotA = new THREE.SpotLight(0xff2d95, 0, 36, 0.46, 0.5, 1.2); spotA.position.set(-6, 9.6, -6); scene.add(spotA); scene.add(spotA.target);
const spotB = new THREE.SpotLight(0x22d3ee, 0, 36, 0.46, 0.5, 1.2); spotB.position.set(6, 9.6, 4); scene.add(spotB); scene.add(spotB.target);
const strobe = new THREE.PointLight(0xffffff, 0, 42, 1.6); strobe.position.set(0, 6.5, -1); scene.add(strobe);

// ---------- helpers ----------
function box(w,h,d,color,x,y,z,opts={}) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d),
    new THREE.MeshStandardMaterial({ color, roughness:opts.rough ?? 0.7, metalness:opts.metal ?? 0.1,
      emissive: opts.emissive ?? 0x000000, emissiveIntensity: opts.ei ?? 1,
      map: opts.map ?? null, transparent: opts.transparent ?? false, opacity: opts.opacity ?? 1 }));
  m.position.set(x,y,z); scene.add(m); return m;
}
function cyl(rt,rb,h,color,x,y,z,opts={}) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,opts.seg ?? 24),
    new THREE.MeshStandardMaterial({ color, roughness:opts.rough ?? 0.6, metalness:opts.metal ?? 0.2,
      emissive: opts.emissive ?? 0x000000, emissiveIntensity: opts.ei ?? 1,
      map: opts.map ?? null, transparent: opts.transparent ?? false, opacity: opts.opacity ?? 1 }));
  m.position.set(x,y,z); scene.add(m); return m;
}
function neonTextTexture(text, cssColor, w=1024, h=256, fontPx=150) {
  const c = document.createElement('canvas'); c.width=w; c.height=h;
  const g = c.getContext('2d');
  g.clearRect(0,0,w,h);
  g.font = `800 ${fontPx}px 'Arial Black', Arial, sans-serif`;
  const tw = g.measureText(text).width;
  if (tw > w * 0.92) {
    fontPx = Math.floor(fontPx * (w * 0.92) / tw);
    g.font = `800 ${fontPx}px 'Arial Black', Arial, sans-serif`;
  }
  g.textAlign='center'; g.textBaseline='middle';
  g.shadowColor = cssColor; g.shadowBlur = 42;
  g.fillStyle = cssColor;
  g.fillText(text, w/2, h/2); g.fillText(text, w/2, h/2);
  g.shadowBlur = 10; g.fillStyle = '#ffffff';
  g.fillText(text, w/2, h/2);
  const t = new THREE.CanvasTexture(c); t.anisotropy = 4; return t;
}
function signPlane(text, color, w, h, x, y, z, ry=0) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w,h),
    new THREE.MeshBasicMaterial({ map: neonTextTexture(text, color), transparent:true, side:THREE.DoubleSide }));
  m.position.set(x,y,z); m.rotation.y = ry; scene.add(m); return m;
}

// ---------- baked procedural textures (HD detail, generated in-page) ----------
const MAX_ANISO = renderer.capabilities.getMaxAnisotropy();
function bakedTexture(size, painter, rx=1, ry=1) {
  const c = document.createElement('canvas'); c.width = size[0]; c.height = size[1];
  painter(c.getContext('2d'), size[0], size[1]);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rx, ry);
  t.anisotropy = MAX_ANISO; t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
function speckle(g, w, h, n, alpha) {
  for (let i=0;i<n;i++) {
    const v = 120 + (Math.random()*135)|0;
    g.fillStyle = `rgba(${v},${v},${v+20},${(Math.random()*alpha).toFixed(3)})`;
    g.fillRect(Math.random()*w, Math.random()*h, 1+Math.random()*2.5, 1+Math.random()*2.5);
  }
}
// dark concrete facade: panel seams + baked grime gradient at the base
const facadeTex = bakedTexture([1024, 512], (g, w, h) => {
  g.fillStyle = '#171422'; g.fillRect(0, 0, w, h);
  speckle(g, w, h, 5200, 0.13);
  g.strokeStyle = 'rgba(0,0,0,0.55)'; g.lineWidth = 3;
  for (let x=0; x<=w; x+=170) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, h); g.stroke(); }
  g.beginPath(); g.moveTo(0, h*0.52); g.lineTo(w, h*0.52); g.stroke();
  g.strokeStyle = 'rgba(190,180,255,0.07)'; g.lineWidth = 1;
  for (let x=85; x<=w; x+=170) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, h); g.stroke(); }
  const grad = g.createLinearGradient(0, h*0.68, 0, h);
  grad.addColorStop(0, 'rgba(0,0,0,0)'); grad.addColorStop(1, 'rgba(0,0,0,0.5)');
  g.fillStyle = grad; g.fillRect(0, h*0.68, w, h*0.32);
}, 2, 1);
// club floor: dark polished stone, faint large-tile seams, purple sheen
const floorTex = bakedTexture([1024, 1024], (g, w, h) => {
  g.fillStyle = '#141021'; g.fillRect(0, 0, w, h);
  speckle(g, w, h, 4200, 0.09);
  g.strokeStyle = 'rgba(0,0,0,0.5)'; g.lineWidth = 2;
  for (let i=0; i<=4; i++) {
    g.beginPath(); g.moveTo(i*w/4, 0); g.lineTo(i*w/4, h); g.stroke();
    g.beginPath(); g.moveTo(0, i*h/4); g.lineTo(w, i*h/4); g.stroke();
  }
  const sheen = g.createLinearGradient(0, 0, w, h);
  sheen.addColorStop(0, 'rgba(139,92,246,0.05)'); sheen.addColorStop(0.5, 'rgba(0,0,0,0)'); sheen.addColorStop(1, 'rgba(34,211,238,0.05)');
  g.fillStyle = sheen; g.fillRect(0, 0, w, h);
}, 3, 2);
// interior walls: dark plaster with subtle mottling
const wallTex = bakedTexture([512, 512], (g, w, h) => {
  g.fillStyle = '#1b1233'; g.fillRect(0, 0, w, h);
  speckle(g, w, h, 2400, 0.08);
  for (let i=0;i<26;i++) {
    g.fillStyle = `rgba(0,0,0,${0.03 + Math.random()*0.05})`;
    g.beginPath(); g.arc(Math.random()*w, Math.random()*h, 22 + Math.random()*70, 0, 7); g.fill();
  }
}, 4, 1);
// wet asphalt for the city ground
const asphaltTex = bakedTexture([1024, 1024], (g, w, h) => {
  g.fillStyle = '#0c0c14'; g.fillRect(0, 0, w, h);
  speckle(g, w, h, 9000, 0.16);
  for (let i=0;i<14;i++) {
    g.fillStyle = `rgba(0,0,0,${0.05 + Math.random()*0.09})`;
    g.beginPath(); g.arc(Math.random()*w, Math.random()*h, 40 + Math.random()*130, 0, 7); g.fill();
  }
  for (let i=0;i<7;i++) {
    g.fillStyle = `rgba(160,170,255,${0.02 + Math.random()*0.03})`;
    g.beginPath(); g.arc(Math.random()*w, Math.random()*h, 26 + Math.random()*70, 0, 7); g.fill();
  }
}, 12, 12);
// soft round sprite for point lights (twinkles, sparkles, mirror spots)
const dotTex = (() => {
  const c = document.createElement('canvas'); c.width = 64; c.height = 64;
  const g = c.getContext('2d');
  const grad = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  grad.addColorStop(0, 'rgba(255,255,255,1)');
  grad.addColorStop(0.4, 'rgba(255,255,255,0.6)');
  grad.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = grad; g.fillRect(0, 0, 64, 64);
  return new THREE.CanvasTexture(c);
})();

// ---------- room shell ----------
// floor (dark polished stone texture)
box(32, 0.2, 24, 0xffffff, 0, -0.1, 0, { rough:0.28, metal:0.5, map: floorTex });
// ceiling
box(32, 0.2, 24, 0x0d0a1a, 0, 10.1, 0, { rough:0.9 });
// walls
box(32, 10, 0.2, 0xffffff, 0, 5, -12, { rough:0.85, map: wallTex });           // back (stage)
box(14.3, 10, 0.2, 0xffffff, -8.85, 5, 12, { rough:0.85, map: wallTex });       // front-left of doorway
box(14.3, 10, 0.2, 0xffffff, 8.85, 5, 12, { rough:0.85, map: wallTex });        // front-right of doorway
box(3.4, 6.8, 0.2, 0xffffff, 0, 6.6, 12, { rough:0.85, map: wallTex });         // front lintel above doorway
box(0.2, 10, 24, 0xffffff, -16, 5, 0, { rough:0.85, map: wallTex });           // left
box(0.2, 10, 24, 0xffffff,  16, 5, 0, { rough:0.85, map: wallTex });           // right
// neon trim along wall tops
for (const s of [-1,1]) {
  box(32, 0.12, 0.12, 0x000000, 0, 9.3, s*11.85, { emissive: s<0?0xff2d95:0x22d3ee, ei:2.2 });
  box(0.12, 0.12, 24, 0x000000, s*15.85, 9.3, 0, { emissive: s<0?0x8b5cf6:0x22d3ee, ei:2.2 });
  box(32, 0.1, 0.1, 0x000000, 0, 0.6, s*11.87, { emissive: 0x8b5cf6, ei:1.4 });
}
// wall panels (subtle vertical slabs with neon seams) on left wall
for (let i=0;i<6;i++) {
  box(0.08, 6.5, 3.2, 0x201538, -15.86, 3.6, -10 + i*4, { rough:0.8 });
}

// ---------- dance floor (animated tiles) ----------
const tiles = [];
const TILE_N = 6, TILE_S = 2;
for (let i=0;i<TILE_N;i++) for (let j=0;j<TILE_N;j++) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(TILE_S-0.08, 0.12, TILE_S-0.08),
    new THREE.MeshStandardMaterial({ color:0x0a0a12, roughness:0.14, metalness:0.55, emissive:0xffffff, emissiveIntensity:1 }));
  m.position.set((i-(TILE_N-1)/2)*TILE_S, 0.06, (j-(TILE_N-1)/2)*TILE_S - 1);
  scene.add(m); tiles.push({ m, i, j });
}

// ---------- stage + DJ booth ----------
box(15, 1, 5.5, 0x1b1430, 0, 0.5, -9.2, { rough:0.6 });                       // stage platform
box(15, 0.1, 0.15, 0x000000, 0, 1.05, -6.5, { emissive:0xff2d95, ei:2 });     // stage edge glow
const booth = box(5.4, 1.25, 1.3, 0x241743, 0, 1.62, -9.4, { rough:0.45, metal:0.4 });
signPlane('CLUB VAPOR', '#ff2d95', 5.2, 1.05, 0, 1.62, -8.72);                // booth front neon
// turntables + mixer
for (const s of [-1,1]) {
  cyl(0.48, 0.48, 0.09, 0x0c0c14, s*1.55, 2.3, -9.4, { rough:0.3, metal:0.6 });
  cyl(0.18, 0.18, 0.1, s<0?0xff2d95:0x22d3ee, s*1.55, 2.31, -9.4, { emissive: s<0?0xff2d95:0x22d3ee, ei:0.7 });
}
box(0.9, 0.1, 0.55, 0x14101f, 0, 2.3, -9.4, { rough:0.4 });
for (let i=0;i<5;i++) box(0.07, 0.05, 0.4, 0x000000, -0.3+i*0.15, 2.37, -9.4, { emissive: PALETTE[i], ei:1.6 });
// ---------- LED wall behind DJ ----------
const ledCanvas = document.createElement('canvas'); ledCanvas.width = 512; ledCanvas.height = 176;
const ledCtx = ledCanvas.getContext('2d');
const ledTex = new THREE.CanvasTexture(ledCanvas);
const ledWall = new THREE.Mesh(new THREE.PlaneGeometry(14.5, 5),
  new THREE.MeshBasicMaterial({ map: ledTex }));
ledWall.position.set(0, 5.6, -11.85); scene.add(ledWall);
function drawLED(t) {
  const cols = 24, rows = 9, cw = ledCanvas.width/cols, ch = ledCanvas.height/rows;
  ledCtx.fillStyle = '#0a0616'; ledCtx.fillRect(0,0,ledCanvas.width, ledCanvas.height);
  for (let x=0;x<cols;x++) for (let y=0;y<rows;y++) {
    const wave = Math.sin(x*0.55 + t*1.7) + Math.cos(y*0.8 - t*1.2);
    if (wave > 0.1) {
      ledCtx.fillStyle = PALETTE_CSS[(x + Math.floor(t*2)) % PALETTE_CSS.length];
      ledCtx.globalAlpha = 0.35 + 0.6*Math.abs(Math.sin(t + x*0.4 + y*0.3));
    } else { ledCtx.fillStyle = '#1c1233'; ledCtx.globalAlpha = 1; }
    ledCtx.fillRect(x*cw+2, y*ch+2, cw-4, ch-4);
  }
  ledCtx.globalAlpha = 1; ledTex.needsUpdate = true;
}
drawLED(0);

// ---------- speaker stacks ----------
for (const s of [-1,1]) for (let k=0;k<3;k++) {
  const y = 1.55 + k*1.32;
  box(1.7, 1.25, 1.1, 0x0d0b16, s*6.4, y, -10.6, { rough:0.5, metal:0.3 });
  const cone = new THREE.Mesh(new THREE.CircleGeometry(0.42, 24),
    new THREE.MeshStandardMaterial({ color:0x05050a, roughness:0.4, emissive: s<0?0xff2d95:0x22d3ee, emissiveIntensity:0.25 }));
  cone.position.set(s*6.4, y, -10.03); scene.add(cone);
  const ring = new THREE.Mesh(new THREE.RingGeometry(0.44, 0.52, 24),
    new THREE.MeshBasicMaterial({ color: s<0?0xff2d95:0x22d3ee, side:THREE.DoubleSide }));
  ring.position.set(s*6.4, y, -10.02); scene.add(ring);
}

// ---------- disco ball ----------
const disco = new THREE.Group();
const ball = new THREE.Mesh(new THREE.SphereGeometry(1.05, 28, 20),
  new THREE.MeshStandardMaterial({ color:0xe8eeff, roughness:0.12, metalness:1.0, emissive:0x8899ff, emissiveIntensity:0.18 }));
disco.add(ball);
// sparkle sprites around the ball
const sparkGeo = new THREE.BufferGeometry();
const sparkPos = [];
for (let i=0;i<160;i++) {
  const r = 2.2 + Math.random()*5, th = Math.random()*Math.PI*2, ph = Math.acos(2*Math.random()-1);
  sparkPos.push(r*Math.sin(ph)*Math.cos(th), (Math.random()-0.5)*3.2, r*Math.sin(ph)*Math.sin(th));
}
sparkGeo.setAttribute('position', new THREE.Float32BufferAttribute(sparkPos, 3));
const sparks = new THREE.Points(sparkGeo, new THREE.PointsMaterial({ color:0xcfe4ff, size:0.11, map: dotTex, transparent:true, opacity:0.85, depthWrite:false }));
disco.add(sparks);
const cable = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.9, 8),
  new THREE.MeshStandardMaterial({ color: 0x333344, roughness: 0.5, metalness: 0.6 }));
cable.position.y = 1.5; disco.add(cable);
disco.position.set(0, 8.1, -1); scene.add(disco);
const discoLight = new THREE.PointLight(0xdfe8ff, 90, 22, 1.8); discoLight.position.set(0, 7.6, -1); scene.add(discoLight);

// ---------- twinkling pin-lights (ceiling + upper walls) ----------
const twinkles = (() => {
  const N = 170;
  const pos = new Float32Array(N * 3), col = new Float32Array(N * 3);
  const phase = [], base = [];
  const tintCols = [[1, 0.85, 0.95], [0.75, 0.95, 1], [1, 1, 1], [0.85, 0.8, 1], [1, 0.92, 0.75]];
  for (let i = 0; i < N; i++) {
    const side = Math.random();
    let x, y, z;
    if (side < 0.55)      { x = (Math.random() - 0.5) * 30; y = 9.85; z = (Math.random() - 0.5) * 22; }
    else if (side < 0.78) { x = (Math.random() - 0.5) * 30; y = 7.5 + Math.random() * 2; z = -11.8; }
    else                 { x = Math.random() < 0.5 ? -15.8 : 15.8; y = 7 + Math.random() * 2.4; z = (Math.random() - 0.5) * 22; }
    pos.set([x, y, z], i * 3);
    phase.push(Math.random() * Math.PI * 2);
    base.push(tintCols[(Math.random() * tintCols.length) | 0]);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  const pts = new THREE.Points(geo, new THREE.PointsMaterial({ size: 0.15, vertexColors: true, map: dotTex,
    transparent: true, opacity: 0.95, blending: THREE.AdditiveBlending, depthWrite: false }));
  scene.add(pts);
  return { phase, base, colAttr: geo.attributes.color };
})();

// ---------- mirror-ball light spots sweeping the room ----------
const mirrorSpots = (() => {
  const N = 46;
  const pos = new Float32Array(N * 3);
  const seeds = [];

  danceLight.intensity = 110 + beatPulse * 140;
  stageLight.color.lerp(wash2, 0.05);
  barLight.color.lerp(wash2, 0.03);
  hemi.color.lerp(wash, 0.05);
  spotA.intensity = 250 + beatPulse * 420;
  spotB.intensity = 250 + beatPulseOff * 420;
  spotA.color.lerp(wash, 0.07); spotB.color.lerp(wash2, 0.07);
  spotA.target.position.set(Math.sin(t * 0.7) * 5.5, 0, -1 + Math.cos(t * 0.7) * 4.2);
  spotB.target.position.set(Math.sin(t * 0.7 + Math.PI) * 5.5, 0, -1 + Math.cos(t * 0.9 + Math.PI) * 4.2);

  // dance floor tiles chase the rainbow
  for (const { m, i, j } of tiles) {
    const hue = ((i + j) * 0.09 + t * 0.22) % 1;
    const dist = Math.hypot(i - 2.5, j - 2.5);
    const ripple = 0.5 + 0.5 * Math.sin(dist * 1.5 - t * 5.2);
    m.material.emissive.setHSL(hue, 0.95, 0.34 + 0.16 * ripple + beatPulse * 0.14);
    m.material.emissiveIntensity = 0.9 + ripple * 0.35 + beatPulse * 0.85;
  }
  // beams sway
  for (const b of beams) {
    b.pivot.rotation.x = Math.sin(t*0.95 + b.phase) * 0.42;
    b.pivot.rotation.z = Math.cos(t*0.8 + b.phase) * 0.42;
    b.pivot.children[0].material.opacity = 0.1 + beatPulse * 0.09;
  }

  disco.rotation.y = t * 0.9;

  disco.position.z = -1 + Math.cos(t * 0.32) * 0.55;

    const s = mirrorSpots.seeds[i];
    const a = s.a + t * s.s;
    mirrorSpots.posAttr.setXYZ(i, Math.cos(a) * s.r + disco.position.x * 0.4, s.y, -1 + Math.sin(a) * s.r * 0.82);

  const doorDist = camera.position.distanceTo(DOOR_POS);
  doorOpen += ((doorDist < 7.5 ? 1 : 0) - doorOpen) * Math.min(1, dt * 5);
  for (const p of doorPanels) p.m.position.x = p.closedX + (p.openX - p.closedX) * doorOpen;

  holo.rotation.y = t * 0.4;

  if (window.__freeCam) controls.update();
  if (window.__gameUpdate) window.__gameUpdate(dt, t, beatPulse);
  renderer.render(scene, camera);
}

function collide(px, pz, r, walls) {
  let x = px, z = pz;
  for (let pass = 0; pass < 2; pass++) for (const w of walls) {
    const cx = Math.max(w.x1, Math.min(x, w.x2)), cz = Math.max(w.z1, Math.min(z, w.z2));
    let dx = x - cx, dz = z - cz;
    const d2 = dx * dx + dz * dz;
    if (d2 > r * r) continue;
    if (d2 > 1e-8) { const d = Math.sqrt(d2); x = cx + dx / d * r; z = cz + dz / d * r; }
    else { // center inside the box: push out along the smallest exit
      const l = x - w.x1, rr = w.x2 - x, tt = z - w.z1, bb = w.z2 - z;
      const m = Math.min(l, rr, tt, bb);
      if (m === l) x = w.x1 - r; else if (m === rr) x = w.x2 + r;
      else if (m === tt) z = w.z1 - r; else z = w.z2 + r;
    }
  }
  return [x, z];
}

let AC = null;
function blip(f0, f1, dur = 0.1, vol = 0.05) {
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = 'square'; o.frequency.setValueAtTime(f0, AC.currentTime);
    o.frequency.exponentialRampToValueAtTime(f1, AC.currentTime + dur);
    g.gain.setValueAtTime(vol, AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + dur);
    o.connect(g).connect(AC.destination); o.start(); o.stop(AC.currentTime + dur);
  } catch (e) { /* audio is a bonus, never a blocker */ }
}

  for (const it of idlers) {

    } else if (it.kind === 'seat') {
      p.g.position.y = it.baseY + Math.sin(t * 1.7 + ph) * 0.012;
      p.armR.rotation.x = -0.4 - Math.pow(Math.max(0, Math.sin(t * 0.5 + ph)), 3) * 0.95;
      p.armL.rotation.x = -0.15;
    } else if (it.kind === 'queue') {
      p.g.rotation.z = Math.sin(t * 1.3 + ph) * 0.045;
      p.g.position.y = it.baseY + Math.abs(Math.sin(t * 2.6 + ph)) * 0.02;
      p.armL.rotation.x = Math.sin(t * 1.3 + ph) * 0.08;
      p.armR.rotation.x = -Math.sin(t * 1.3 + ph) * 0.08;
    } else if (it.kind === 'bouncer') {
      p.g.rotation.y = it.baseRy + Math.sin(t * 0.35 + ph) * 0.35;
      p.g.rotation.z = Math.sin(t * 0.9 + ph) * 0.015;
    } else if (it.kind === 'groove') {
      p.g.position.y = it.baseY + Math.abs(Math.sin(t * 4.13 + ph)) * 0.13;
      p.armL.rotation.z = 2.4 + Math.sin(t * 4.13 + ph) * 0.5;
      p.armR.rotation.z = -2.4 + Math.cos(t * 4.13 + ph) * 0.5;
      p.g.rotation.y = it.baseRy + Math.sin(t * 1.1 + ph) * 0.4;
    }
  }
  for (const b of blinkMats) b.m.color.setHSL((t * 0.3 + b.ph) % 1, 0.85, 0.55);
  for (const s of steamPuffs) {
    const cyc = (t * 0.45 + s.ph) % 3;

// ---- per-frame game update (called from animate) ----
const camTargetPos = new THREE.Vector3();
window.__gameUpdate = (dt, t, beatPulse) => {
  dt = Math.min(dt, 0.05);
  // NPC dancers bounce with the beat
  for (const d of dancers) {
    const bounce = Math.abs(Math.sin(t * 4.13 + d.phase)) * 0.16;
    d.g.position.y = (d.isDJ ? 1.0 : 0.12) + bounce;
    if (d.isDJ) {
      d.armR.rotation.x = -2.2 + Math.sin(t * 9) * 0.45; d.armL.rotation.z = 2.5;
      d.g.rotation.y = Math.sin(t * 1.3) * 0.2;
    } else {
      d.g.rotation.y += dt * d.spin;
      d.armL.rotation.z = 2.5 + Math.sin(t * 4.13 + d.phase) * 0.5;
      d.armR.rotation.z = -2.5 + Math.cos(t * 4.13 + d.phase) * 0.5;
      d.armL.rotation.x = Math.sin(t * 2.07 + d.phase) * 0.4;
      d.armR.rotation.x = -Math.sin(t * 2.07 + d.phase) * 0.4;
    }
  }
  // NPC walkers stroll their loops
  for (const w of walkers) {
    const [tx, tz] = w.loop[w.wp];
    const dx = tx - w.g.position.x, dz = tz - w.g.position.z, dist = Math.hypot(dx, dz);
    if (dist < 0.4) { w.wp = (w.wp + 1) % w.loop.length; continue; }
    const sp = 1.15, vx = dx / dist * sp, vz = dz / dist * sp;
    w.g.position.x += vx * dt; w.g.position.z += vz * dt;
    const targetYaw = Math.atan2(vx, vz);
    let dy = targetYaw - w.g.rotation.y;
    while (dy > Math.PI) dy -= Math.PI * 2; while (dy < -Math.PI) dy += Math.PI * 2;
    w.g.rotation.y += dy * Math.min(1, dt * 6);
    w.walkPh += dt * 7.5;
    const sw = Math.sin(w.walkPh) * 0.55;
    w.legL.rotation.x = sw; w.legR.rotation.x = -sw;
    w.armL.rotation.x = -sw * 0.7; w.armR.rotation.x = sw * 0.7;
    w.g.position.y = (w.loop === walkerLoops[1] || w.loop === walkerLoops[3] ? -0.02 : 0) + Math.abs(Math.sin(w.walkPh)) * 0.04;
  }
  if (window.__lifeUpdate) window.__lifeUpdate(dt, t);
  // coins spin + bob; sparkles fade
  for (const c of coins) { if (!c.got) { c.g.rotation.y = t * 2.6 + c.ph; c.g.position.y = 1.05 + Math.sin(t * 2 + c.ph) * 0.13; } }
  for (let i = bursts.length - 1; i >= 0; i--) {
    const b = bursts[i]; b.life += dt;
    const pa = b.pts.geometry.attributes.position;
    for (let j = 0; j < b.vel.length; j++) {
      b.vel[j][1] -= 5.5 * dt;
      pa.setXYZ(j, pa.getX(j) + b.vel[j][0] * dt, Math.max(0.1, pa.getY(j) + b.vel[j][1] * dt), pa.getZ(j) + b.vel[j][2] * dt);
    }
    pa.needsUpdate = true; b.pts.material.opacity = Math.max(0, 1 - b.life / 0.65);
    if (b.life > 0.65) { scene.remove(b.pts); b.pts.geometry.dispose(); b.pts.material.dispose(); bursts.splice(i, 1); }
  }

  if (window.__freeCam) return; // screenshots drive the camera instead

  if (mode === 'walk') {
    const f = (keys.KeyW || keys.ArrowUp ? 1 : 0) - (keys.KeyS || keys.ArrowDown ? 1 : 0) - joy.y;
    const r = (keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0) + joy.x;
    const run = (keys.ShiftLeft || keys.ShiftRight) ? 8.2 : 4.6;
    const fx = -Math.sin(player.yaw), fz = -Math.cos(player.yaw);
    const rx = Math.cos(player.yaw), rz = -Math.sin(player.yaw);
    let mx = (fx * f + rx * r), mz = (fz * f + rz * r);
    const ml = Math.hypot(mx, mz); if (ml > 1) { mx /= ml; mz /= ml; }
    player.x += mx * run * dt; player.z += mz * run * dt;
    [player.x, player.z] = collide(player.x, player.z, 0.45, P_WALLS.concat(solids));
    player.x = Math.max(-78, Math.min(78, player.x)); player.z = Math.max(-46, Math.min(84, player.z));
    player.bob = ml > 0.1 ? player.bob + dt * 9 : 0;
    camera.position.set(player.x, 1.7 + Math.sin(player.bob) * 0.05, player.z);
    camera.rotation.order = 'YXZ'; camera.rotation.set(player.pitch, player.yaw, 0);
    // pickup prompt
    const nc = nearestCar();
    if (nc) { promptEl.textContent = IS_TOUCH ? '🚗 Tap DRIVE to hop in!' : '🚗 Press E to hop in!'; promptEl.style.display = 'block'; driveBtn.style.display = 'block'; driveBtn.innerHTML = '&#128663; DRIVE'; }
    else { promptEl.style.display = 'none'; driveBtn.style.display = 'none'; }
    checkCoins(player.x, player.z, 1.25);
  } else if (activeCar) {
    const c = activeCar, g = c.g;
    const th = (keys.KeyW || keys.ArrowUp ? 1 : 0) - (keys.KeyS || keys.ArrowDown ? 1 : 0) - joy.y;
    const st = (keys.KeyA || keys.ArrowLeft ? 1 : 0) - (keys.KeyD || keys.ArrowRight ? 1 : 0) - joy.x;
    c.speed += th * 15 * dt; c.speed -= c.speed * 1.05 * dt;
    c.speed = Math.max(-8, Math.min(24, c.speed));
    if (Math.abs(c.speed) > 0.15) c.heading += st * 1.75 * dt * Math.min(1, Math.abs(c.speed) / 6) * Math.sign(c.speed);
    let nx = g.position.x + Math.cos(c.heading) * c.speed * dt;
    let nz = g.position.z - Math.sin(c.heading) * c.speed * dt;
    const before = [nx, nz];
    [nx, nz] = collide(nx, nz, 1.6, CAR_WALLS.concat(solids));
    if (Math.abs(nx - before[0]) > 0.01 || Math.abs(nz - before[1]) > 0.01) c.speed *= -0.22;
    g.position.x = Math.max(-80, Math.min(80, nx)); g.position.z = Math.max(-48, Math.min(86, nz));
    g.rotation.y = c.heading;
    g.position.y = 0.78 + Math.sin(t * 2.2) * 0.045;
    camTargetPos.set(g.position.x - Math.cos(c.heading) * 8.4, 4.1, g.position.z + Math.sin(c.heading) * 8.4);
    camera.position.lerp(camTargetPos, 1 - Math.pow(0.0015, dt));
    camera.lookAt(g.position.x + Math.cos(c.heading) * 5, 1.2, g.position.z - Math.sin(c.heading) * 5);
    promptEl.textContent = IS_TOUCH ? '🏃 Tap EXIT to hop out' : '🏃 Press E to hop out'; promptEl.style.display = 'block';
    driveBtn.style.display = 'block'; driveBtn.innerHTML = '&#127939; EXIT';
    checkCoins(g.position.x, g.position.z, 2.3);
  }
};
function checkCoins(px, pz, rad) {
  for (const c of coins) {
    if (c.got) continue;
    if (Math.hypot(c.x - px, c.z - pz) < rad) {
      c.got = true; c.g.visible = false; coinCount++; score += 100;
      sparkleBurst(c.x, 1.2, c.z); blip(920, 1560, 0.09); updateHUD();
      if (coinCount === coins.length) {
        score += 1000; updateHUD();
        showBanner(`🎉 ALL ${coins.length} COINS! +1000 BONUS 🎉`);
        blip(660, 880, 0.12); setTimeout(() => blip(880, 1180, 0.12), 130); setTimeout(() => blip(1180, 1560, 0.2), 260);
        setTimeout(() => { for (const cc of coins) { cc.got = false; cc.g.visible = true; } coinCount = 0; updateHUD(); }, 4200);
      }
    }
  }
}

window.__enterClub = () => { if (mode === 'drive') interact(); window.__freeCam = false; controls.enabled = false; player.x = 0.5; player.z = 8.6; player.yaw = 0; player.pitch = -0.02; };

  const c = parkedCars[i]; if (mode !== 'drive') { player.x = c.g.position.x; player.z = c.g.position.z; interact(); }

    '#bit-footbar .bit-x{margin-left:auto;background:none;border:none;color:#aaa;font-size:14px;cursor:pointer;padding:0 4px}' +
    '#bit-pcbanner{position:fixed;top:0;left:0;right:0;z-index:2147483000;background:rgba(24,16,48,.94);color:#fff;font-family:sans-serif;font-size:14px;text-align:center;padding:10px 40px 10px 12px;line-height:1.45}' +
    '#bit-pcbanner b{color:#ff9ff3}' +
    '#bit-pcbanner .bit-x{position:absolute;right:8px;top:6px;background:none;border:none;color:#ccc;font-size:18px;cursor:pointer}';
  document.head.appendChild(css);
  var isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
  if (isTouch) {
    var b = document.createElement('div'); b.id = 'bit-pcbanner';
    b.innerHTML = '\u{1F4F1} This game is built for <b>PC \u2014 keyboard &amp; mouse recommended!</b> You can look around on mobile, but for the real game, open this page on a computer.';
    var bx = document.createElement('button'); bx.className = 'bit-x'; bx.textContent = '\u{2715}';
    bx.addEventListener('click', function () { b.remove(); });
    b.appendChild(bx); document.body.appendChild(b);
  }
  var bar = document.createElement('div'); bar.id = 'bit-footbar';
  var brand = document.createElement('span'); brand.className = 'bit-brand'; brand.textContent = '\u{1F4EC} Contact me \u2014 Michael Dembenski & Bit \u{1F47E}:';
  bar.appendChild(brand);
  LINKS.forEach(function (l) { var a = document.createElement('a'); a.href = l[1]; a.textContent = l[0]; a.target = '_blank'; a.rel = 'noopener'; bar.appendChild(a); });
  var x = document.createElement('button'); x.className = 'bit-x'; x.textContent = '\u{2715}';
  x.addEventListener('click', function () { bar.remove(); });
  bar.appendChild(x);
  document.body.appendChild(bar);
})();
