  <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skate Jumper</title>
    <script src="./tailwind.js"></script>
    <!-- Add Pixel Font (Press Start 2P) -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <!-- Tone.js for Music and Sound Effects -->
    <script src="./Tone.min.js"></script>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            /* New Retro Pattern Background */
            background-color: #1e293b; /* Fallback: Slate-800 */
            background-image: repeating-linear-gradient(
                -45deg,
                #1e293b, /* Dark base */
                #1e293b 10px,
                #2d3a4b 10px, /* Slightly lighter stripe for texture */
                #2d3a4b 20px
            );
            /* Use a fallback for the main body */
            font-family: 'Inter', sans-serif; 
            flex-direction: column;
        }
        #game-container {
            border: 8px solid #334155; /* Slate-700 border */
            border-radius: 12px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5), inset 0 0 15px rgba(255, 255, 255, 0.1);
            position: relative;
        }
        canvas {
            background-color: #475569; /* Slate-600 for the sky/city backdrop */
            display: block;
            width: 100%;
            height: 400px;
        }
        .controls, .score-display {
            color: #f1f5f9; /* Slate-100 */
            text-align: center;
            margin-bottom: 1rem;
            width: 80%;
            max-width: 700px; /* Match container width */
        }
        .controls h1 {
            font-size: 2.0rem; /* Adjusted for pixel font */
            font-weight: 400; /* Pixel font doesn't use bold weights */
            color: #38bdf8; /* Sky-400 */
            text-shadow: 4px 4px #0c4a6e; /* Hard shadow for pixel effect */
            /* Apply the pixel font to the title */
            font-family: 'Press Start 2P', cursive;
        }
        .controls p {
            font-size: 0.75rem; /* Smaller, clearer size for pixel font */
            margin-top: 0.5rem;
             /* Apply the pixel font to instructions */
            font-family: 'Press Start 2P', cursive;
        }
        
        /* Apply pixel font to score display */
        .score-display {
            font-family: 'Press Start 2P', cursive;
            font-size: 0.75rem;
        }

        /* Modal styling for Game Over/Start */
        #message-box {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: rgba(0, 0, 0, 0.7);
            z-index: 10;
            border-radius: 4px;
            text-align: center;
            transition: opacity 0.3s ease;
        }
        .modal-content {
            background: #111827; /* Dark BG */
            padding: 30px 40px;
            border-radius: 10px;
            box-shadow: 0 0 30px rgba(56, 189, 248, 0.5); /* Blue glow */
            color: #f1f5f9;
            /* Apply pixel font to modal */
            font-family: 'Press Start 2P', cursive;
        }
        .modal-content h2 {
            font-size: 1.5rem; /* Adjusted for pixel font */
            font-weight: 400;
            color: #38bdf8;
            margin-bottom: 10px;
        }
        .modal-content button {
            background: #38bdf8;
            color: #111827;
            padding: 10px 20px;
            margin-top: 20px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            box-shadow: 0 4px #0c4a6e;
            font-family: 'Press Start 2P', cursive;
            font-size: 0.8rem;
        }
        .modal-content button:hover {
            background: #7dd3fc;
        }
    </style>
</head>
<body>

    <div class="controls">
        <h1>BLOCK SKATE JUMPER</h1>
        <p class="font-mono text-sm">Use **SPACEBAR** to jump. Use **A/D** (or **Left/Right**) to move. Use **S** (or **Down**) to **DUCK**!</p>
    </div>

    <div id="game-container" style="width: 700px; height: 400px;">
        <canvas id="gameCanvas" width="700" height="400"></canvas>
        
        <!-- Game Message Box -->
        <div id="message-box">
            <div class="modal-content">
                <h2>Ready to Grind?</h2>
                <p>Press the button to start skating!</p>
                <button onclick="startGame()">Start Game</button>
            </div>
        </div>
    </div>

    <div class="score-display mt-4 p-2 bg-gray-700 rounded-lg shadow-inner">
        Speed: <span id="speedValue" class="font-bold text-yellow-300">0.0</span> | 
        Score: <span id="scoreValue" class="font-bold text-yellow-300">0</span> |
        Combo: <span id="comboValue" class="font-bold text-red-400">x1.0</span>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('scoreValue');
        const speedDisplay = document.getElementById('speedValue');
        const messageBox = document.getElementById('message-box');

        // --- Tone.js Audio Setup ---
        let kick, melody, sfxJump, sfxCrash, sfxDuck;
        let musicSequence;
        const BPM = 140;

        function initAudio() {
            // 1. Drum/Rhythm Instruments (MembraneSynth for retro kick)
            kick = new Tone.MembraneSynth({
                pitchDecay: 0.05,
                octaves: 2,
                envelope: { attack: 0.001, decay: 0.4, sustain: 0.01, release: 0.8 },
                volume: -5
            }).toDestination();
            
            // 2. Bass/Melody Synth (Square wave for chiptune sound)
            melody = new Tone.Synth({
                oscillator: { type: "square" },
                envelope: { attack: 0.005, decay: 0.1, sustain: 0.2, release: 0.5 },
                volume: -10 
            }).toDestination();

            // 3. Sound Effects - Jump (Rising arpeggio)
            sfxJump = new Tone.PolySynth(Tone.Synth, {
                oscillator: { type: "triangle" },
                envelope: { attack: 0.001, decay: 0.15, sustain: 0.0, release: 0.05 },
                volume: -5
            }).toDestination();
            
            // 4. Sound Effects - Crash (Harsh white noise)
            sfxCrash = new Tone.NoiseSynth({
                noise: { type: "white" },
                envelope: { attack: 0.001, decay: 0.6, sustain: 0.0, release: 0.1 },
                volume: 0
            }).toDestination();
            
            // 5. Sound Effects - Duck/Grind (Metallic hit)
            sfxDuck = new Tone.MetalSynth({
                frequency: 100,
                envelope: { attack: 0.001, decay: 0.1, release: 0.1 },
                harmonicity: 3.1,
                modulationIndex: 10,
                resonance: 400,
                octaves: 0.5,
                volume: -15
            }).toDestination();

            Tone.Transport.bpm.value = BPM;
        }

        function createMusicSequence() {
            // Simple 4-beat skate rhythm and bassline
            const sequenceEvents = [
                // Beat 1: Kick & C3
                { beat: '0', kick: true, note: 'C3', duration: '8n' },
                // Beat 1.5: Kick & G2 bass
                { beat: '0:2', kick: true, note: 'G2', duration: '8n' },
                // Beat 2: Kick & E3
                { beat: '1', kick: true, note: 'E3', duration: '8n' },
                // Beat 2.5: A2 bass
                { beat: '1:2', kick: false, note: 'A2', duration: '8n' },
                // Repeat for second half (variation)
                { beat: '2', kick: true, note: 'C3', duration: '8n' },
                { beat: '2:2', kick: true, note: 'G2', duration: '8n' },
                { beat: '3', kick: true, note: 'F3', duration: '8n' },
                { beat: '3:2', kick: false, note: 'A2', duration: '8n' },
            ];

            musicSequence = new Tone.Sequence((time, data) => {
                if (data.kick) {
                    kick.triggerAttackRelease("C1", "8n", time);
                }
                melody.triggerAttackRelease(data.note, data.duration, time);
            }, sequenceEvents, "4n").start(0); // Sequence runs every 4 beats (1 measure)
        }

        // --- Game Constants ---
        const GRAVITY = 0.8;
        const JUMP_POWER = -17;
        const GROUND_Y = canvas.height - 30;
        const DEFAULT_PERSON_HEIGHT = 60; // Standard standing height (body + head)
        const DUCKING_PERSON_HEIGHT = 25;  // Compressed height when ducking

        // The top edge of the low barrier obstacle. Needs to be low enough to duck under (25 + clearance)
        const DUCK_BARRIER_TOP_Y = GROUND_Y - 45; 


        // --- Game State ---
        let isPlaying = false;
        let score = 0;
        let animationFrameId;

        // --- Skater State (Player) ---
        const skater = {
            width: 50,
            height: 10, // Thin board (10px)
            x: 50,
            y: GROUND_Y - 10, // Initial Y position (top of the board)
            velocityY: 0,
            isJumping: false,
            isDucking: false, // State for ducking
            personHeight: DEFAULT_PERSON_HEIGHT, // Dynamic height of segments
            personWidth: 20, 
            
            // Horizontal Movement properties
            velocityX: 0, 
            acceleration: 0.4,
            friction: 0.96,
            maxForwardSpeed: 15,
            maxBackwardSpeed: -5,

            // --- Trick/Combo System State ---
            airTime: 0, // Frames spent in the air
            comboMultiplier: 1.0, // Current score multiplier
            comboTimer: 0, // Used for decay timing
        };
        
        // --- Obstacle State ---
        let obstacles = [];
        let obstacleSpawnRate = 120; // Frames between spawns
        let frameCount = 0;
        let horizontalDirection = 0; // -1 for backward, 1 for forward

        // --- Input Handler ---
        document.addEventListener('keydown', async (e) => {
            if (e.code === 'Space' && !skater.isJumping && isPlaying) {
                skater.isJumping = true;
                skater.velocityY = JUMP_POWER;
                skater.isDucking = false; // Cannot duck while jumping/in air
                skater.personHeight = DEFAULT_PERSON_HEIGHT;
                skater.airTime = 0; // Reset air time on jump start

                // Play Jump SFX: quick two-tone rising arpeggio
                if (sfxJump) sfxJump.triggerAttackRelease(['C5', 'E5'], '16n');

            } else if ((e.code === 'KeyD' || e.code === 'ArrowRight') && isPlaying) {
                horizontalDirection = 1;
            } else if ((e.code === 'KeyA' || e.code === 'ArrowLeft') && isPlaying) {
                horizontalDirection = -1;
            } else if ((e.code === 'KeyS' || e.code === 'ArrowDown') && isPlaying && !skater.isJumping) {
                // Ducking mechanism
                if (!skater.isDucking) { // Only play SFX on the initial press
                    skater.isDucking = true;
                    skater.personHeight = DUCKING_PERSON_HEIGHT;
                    // Play Duck/Grind SFX (metallic sound)
                    if (sfxDuck) sfxDuck.triggerAttackRelease("8n"); 
                }
            }
        });

        document.addEventListener('keyup', (e) => {
            if ((e.code === 'KeyD' || e.code === 'ArrowRight') && horizontalDirection === 1) {
                horizontalDirection = 0;
            } else if ((e.code === 'KeyA' || e.code === 'ArrowLeft') && horizontalDirection === -1) {
                horizontalDirection = 0;
            } else if ((e.code === 'KeyS' || e.code === 'ArrowDown') && isPlaying) {
                // Stop ducking
                skater.isDucking = false;
                skater.personHeight = DEFAULT_PERSON_HEIGHT;
            }
        });

        // --- Game Functions ---

        function drawBackground() {
            // Use current velocity to scroll background elements
            const scrollSpeed = skater.velocityX * 0.5;

            // Draw simple scrolling "cityscape" dots/stars
            ctx.fillStyle = '#6b7280'; // Gray
            for (let i = 0; i < canvas.width; i += 50) {
                for (let j = 0; j < 3; j++) {
                    const x = (i + (frameCount * scrollSpeed) % 50 + j * 15) % canvas.width;
                    const y = 100 + j * 50;
                    ctx.fillRect(x, y, 5, 5);
                }
            }
        }

        function drawGround() {
            // Draw dark asphalt color
            ctx.fillStyle = '#1c1c1c';
            ctx.fillRect(0, GROUND_Y, canvas.width, canvas.height - GROUND_Y);

            // Draw dashed yellow lines on the ground (scrolling)
            const scrollSpeed = skater.velocityX * 1.5;
            ctx.strokeStyle = '#facc15'; // Yellow
            ctx.lineWidth = 3;
            for (let i = 0; i < canvas.width; i += 50) {
                ctx.beginPath();
                ctx.moveTo(i + (frameCount * scrollSpeed) % 50, GROUND_Y + 15);
                ctx.lineTo(i + 30 + (frameCount * scrollSpeed) % 50, GROUND_Y + 15);
                ctx.stroke();
            }
        }

        function drawSkater() {
            ctx.shadowColor = 'rgba(0, 0, 0, 0.5)';
            ctx.shadowBlur = 5;
            
            const boardY = skater.y;
            const center = skater.x + skater.width / 2;
            
            // --- 1. Skater Board (Red/Orange) ---
            ctx.fillStyle = '#ef4444'; // Red
            ctx.fillRect(skater.x, boardY, skater.width, skater.height);
            
            if (skater.isDucking) {
                // --- DUCKING POSE (Low, wide block for rolling) ---
                const bodyHeight = DUCKING_PERSON_HEIGHT;
                const bodyY = boardY - bodyHeight;
                ctx.fillStyle = '#3b82f6'; // Combined color for the roll/crouch
                
                // Draw a wide, low body block
                const duckingWidth = skater.personWidth + 10;
                ctx.fillRect(center - duckingWidth / 2, bodyY, duckingWidth, bodyHeight);

                // Add a small head block on top of the 'roll'
                const headSize = 10;
                ctx.fillStyle = '#fde68a';
                ctx.fillRect(center - headSize / 2, bodyY - headSize, headSize, headSize);

            } else {
                // --- STANDING POSE (Default) ---
                // 2. Legs (Blue Jeans)
                const legHeight = 15;
                const legWidth = 10;
                const legY = boardY - legHeight;
                ctx.fillStyle = '#3b82f6';
                ctx.fillRect(center - legWidth - 2, legY, legWidth, legHeight);
                ctx.fillRect(center + 2, legY, legWidth, legHeight);
                
                // 3. Torso (Green Shirt)
                const torsoHeight = 30;
                const torsoWidth = skater.personWidth;
                const torsoY = legY - torsoHeight;
                ctx.fillStyle = '#10b981';
                ctx.fillRect(center - torsoWidth / 2, torsoY, torsoWidth, torsoHeight);

                // 4. Head (Skin Tone)
                const headSize = 15;
                const headY = torsoY - headSize;
                ctx.fillStyle = '#fde68a';
                ctx.fillRect(center - headSize / 2, headY, headSize, headSize);
            }

            ctx.shadowBlur = 0; // Reset shadow
        }

        function updateSkaterJump() {
            if (skater.isJumping) {
                // Apply gravity
                skater.velocityY += GRAVITY;
                skater.y += skater.velocityY;
                skater.airTime++; // Increment air time for combo tracking

                // Check for ground collision
                if (skater.y + skater.height > GROUND_Y) {
                    skater.y = GROUND_Y - skater.height; // Clamp to ground
                    skater.isJumping = false;
                    skater.velocityY = 0;
                    skater.airTime = 0; // Reset air time on landing
                }
            }
        }
        
        function updateHorizontalMovement() {
            if (horizontalDirection !== 0) {
                // Apply acceleration
                skater.velocityX += skater.acceleration * horizontalDirection;
            }

            // Apply friction/deceleration if not accelerating
            if (horizontalDirection === 0) {
                skater.velocityX *= skater.friction;
            }

            // Clamp speed (allow moderate backward speed, higher forward speed)
            skater.velocityX = Math.max(skater.maxBackwardSpeed, Math.min(skater.maxForwardSpeed, skater.velocityX));
            
            // Stop movement if speed is very close to zero
            if (Math.abs(skater.velocityX) < 0.1) {
                skater.velocityX = 0;
            }
            
            // Update speed display
            speedDisplay.textContent = Math.abs(skater.velocityX).toFixed(1);
        }


        function spawnObstacle() {
            // Define potential obstacle configurations: (width, height/thickness, type, color, topY position)
            const obstacleConfigs = [
                // Jump obstacles (y is the top edge)
                { width: 40, height: 40, type: 'crate', color: '#f59e0b', y: GROUND_Y - 40 }, 
                { width: 25, height: 75, type: 'block', color: '#b91c1c', y: GROUND_Y - 75 },
                { width: 80, height: 15, type: 'rail', color: '#3b82f6', y: GROUND_Y - 15 },
                // Duck obstacle (Requires DUCKING: top edge is high up)
                { width: 100, height: 20, type: 'low_barrier', color: '#9d174d', y: DUCK_BARRIER_TOP_Y },
            ];

            // Randomly select a configuration
            const config = obstacleConfigs[Math.floor(Math.random() * obstacleConfigs.length)];
            
            obstacles.push({
                x: canvas.width,
                y: config.y, // Top edge of the obstacle
                width: config.width,
                height: config.height, // Vertical thickness
                type: config.type,
                color: config.color
            });
            
            // Randomize next spawn time based on speed
            const currentBaseRate = 120 - Math.abs(skater.velocityX) * 5; 
            const minSpawnRate = 40;
            const spawnVariance = Math.random() * 40;
            obstacleSpawnRate = Math.max(minSpawnRate, currentBaseRate + spawnVariance);
        }

        function updateObstacles() {
            // Move obstacles using the skater's velocity
            for (let i = 0; i < obstacles.length; i++) {
                obstacles[i].x -= skater.velocityX;
            }

            // --- Combo Decay Logic (Only decay while moving forward and no trick is performed) ---
            if (skater.velocityX > 3) {
                 skater.comboTimer--;
                 if (skater.comboTimer <= 0) {
                    skater.comboMultiplier = Math.max(1.0, skater.comboMultiplier - 0.05); // Slow decay
                    skater.comboTimer = 30; // Reset timer (~0.5 seconds)
                    document.getElementById('comboValue').textContent = `x${skater.comboMultiplier.toFixed(1)}`;
                 }
            }


            // Scoring and Trick System Check (Only process the first obstacle)
            if (obstacles.length > 0) {
                const obs = obstacles[0];
                
                // If the obstacle is COMPLETELY behind the skater's X position AND we are moving forward
                if (obs.x + obs.width < skater.x && skater.velocityX > 0) {
                    
                    // --- NEW SCORING LOGIC BASED ON SPEED ---
                    const currentSpeed = Math.abs(skater.velocityX);
                    // Calculates a factor from 0.0 (min speed) to 1.0 (max speed)
                    const speedFactor = Math.min(1.0, currentSpeed / skater.maxForwardSpeed); 
                    
                    // Base points range from 1 (slow) to 4 (max speed)
                    // 1 (min) + 0 to 3 (speed bonus) = 1 to 4
                    const basePoints = 1 + Math.floor(speedFactor * 3); 
                    // -----------------------------------------

                    // 1. Basic Score (Multiplied by combo multiplier)
                    score += Math.floor(basePoints * skater.comboMultiplier);
                    
                    // 2. Trick/Combo Bonus Calculation
                    let bonus = 0;
                    
                    if (obs.type === 'low_barrier' && skater.isDucking) {
                        // Perfect Duck earns a combo increase
                        bonus = 5; // Base bonus points for the trick
                        skater.comboMultiplier = Math.min(5.0, skater.comboMultiplier + 0.3);

                    } else if (obs.type !== 'low_barrier' && skater.airTime > 5) {
                        // Jump over a tall obstacle
                        
                        // Big Air Bonus (long jump)
                        if (skater.airTime > 35) { 
                             bonus = 8;
                             skater.comboMultiplier = Math.min(5.0, skater.comboMultiplier + 0.4);
                        } else if (skater.airTime > 15) {
                             bonus = 4;
                             skater.comboMultiplier = Math.min(5.0, skater.comboMultiplier + 0.2);
                        }
                    }
                    
                    // Add bonus points, multiplied by the current combo
                    score += Math.floor(bonus * skater.comboMultiplier);
                    
                    // Reset combo timer on successful trick
                    if (bonus > 0) {
                        skater.comboTimer = 90; // Give three times the decay time to hold the combo
                    }
                    
                    // Update UI
                    scoreDisplay.textContent = score;
                    document.getElementById('comboValue').textContent = `x${skater.comboMultiplier.toFixed(1)}`;
                    
                    obstacles.shift(); // Remove the passed obstacle
                }
            }

            // Spawn new obstacle, but only if moving forward faster than a crawl (speed > 3)
            if (skater.velocityX > 3) {
                 if (frameCount % Math.floor(obstacleSpawnRate) === 0) {
                    spawnObstacle();
                 }
            }

            // Remove obstacles that go far off screen backward, to keep the array clean
            if (obstacles.length > 0 && obstacles[0].x < -100) {
                obstacles.shift();
            }
        }

        function drawObstacles() {
            for (const obs of obstacles) {
                ctx.shadowColor = 'rgba(0, 0, 0, 0.7)';
                ctx.shadowBlur = 10;
                ctx.fillStyle = obs.color; 

                if (obs.type === 'rail') {
                    // Draw a thin rail/bar on the ground
                    ctx.fillRect(obs.x, obs.y + obs.height * 0.5, obs.width, obs.height * 0.5);
                } else {
                    // Draw a standard block/crate or low barrier
                    ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
                }

                ctx.shadowBlur = 0;
            }
        }

        function checkCollision() {
            // Skater's combined collision box (from top of body to bottom of board)
            const skaterBox = {
                left: skater.x,
                // CRITICAL: Use dynamic personHeight for the top collision boundary
                top: skater.y - skater.personHeight, 
                right: skater.x + skater.width,
                bottom: skater.y + skater.height 
            };

            for (const obs of obstacles) {
                const obsBox = {
                    left: obs.x,
                    top: obs.y,
                    right: obs.x + obs.width,
                    bottom: obs.y + obs.height
                };

                // Standard Axis-Aligned Bounding Box (AABB) collision detection
                if (skaterBox.right > obsBox.left &&
                    skaterBox.left < obsBox.right &&
                    skaterBox.bottom > obsBox.top &&
                    skaterBox.top < obsBox.bottom) {
                    
                    // Collision detected!
                    gameOver();
                    return true;
                }
            }
            return false;
        }

        function gameLoopFn() {
            if (!isPlaying) {
                cancelAnimationFrame(animationFrameId);
                return;
            }

            // 1. Clear Canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 2. Draw & Update Elements
            updateHorizontalMovement(); 
            drawBackground();
            drawGround();
            updateSkaterJump(); 
            updateObstacles();
            drawObstacles();
            drawSkater();

            // 3. Check Collision
            checkCollision();

            // 4. Update Frame Count and Loop
            frameCount++;
            animationFrameId = requestAnimationFrame(gameLoopFn);
        }

        function gameOver() {
            isPlaying = false;
            cancelAnimationFrame(animationFrameId);
            
            // Stop Music and play crash SFX
            if (Tone.Transport.state === 'started') {
                Tone.Transport.stop();
            }
            if (sfxCrash) sfxCrash.triggerAttackRelease("4n");
            
            const modalContent = document.querySelector('#message-box .modal-content');
            modalContent.innerHTML = `
                <h2>GAME OVER!</h2>
                <p>You scored <span class="text-yellow-300 font-bold">${score}</span> points.</p>
                <p class="text-lg mt-2">Max Combo Achieved: <span class="text-red-400 font-bold">x${skater.comboMultiplier.toFixed(1)}</span></p>
                <button onclick="startGame()">Try Again</button>
            `;
            messageBox.style.opacity = '1';
            messageBox.style.visibility = 'visible';
        }

        window.startGame = async function() {
            // CRITICAL: Start the Tone context on a user gesture to allow audio playback
            if (Tone.context.state !== 'running') {
                await Tone.start();
            }

            // Reset skater state
            skater.y = GROUND_Y - skater.height;
            skater.isJumping = false;
            skater.isDucking = false; // Reset ducking state
            skater.personHeight = DEFAULT_PERSON_HEIGHT; // Reset height
            skater.velocityY = 0;
            skater.velocityX = 0; 
            horizontalDirection = 0; 
            skater.airTime = 0;
            skater.comboMultiplier = 1.0;
            skater.comboTimer = 0;

            obstacles = [];
            score = 0;
            frameCount = 0;
            obstacleSpawnRate = 120; 
            scoreDisplay.textContent = score;
            speedDisplay.textContent = skater.velocityX.toFixed(1);
            document.getElementById('comboValue').textContent = `x${skater.comboMultiplier.toFixed(1)}`;

            // Start Music
            if (musicSequence) {
                Tone.Transport.start();
            }

            // Hide message box and start game
            messageBox.style.opacity = '0';
