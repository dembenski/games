  <!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brainy Rush - Endless Math Game</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        <div id="ui-layer">
            <div id="title-screen" class="screen">
                <h1>Brainy Rush</h1>
                <p>Solve Fast or Crash!</p>
                <p style="font-size: 1.2rem; margin-top: 10px; color: #555;">Play mini games to earn a reward game!</p>
                <div class="difficulty-select">
                    <button id="btn-easy" class="diff-btn easy">EASY</button>
                    <button id="btn-medium" class="diff-btn medium">MEDIUM</button>
                    <button id="btn-hard" class="diff-btn hard">HARD</button>
                </div>
                <button id="btn-shop"
                    style="margin-top: 20px; background-color: #9B5DE5; font-size: 1.5rem; padding: 0.8rem 2rem;">SHOP
                    🛍️</button>
            </div>
            <div id="shop-screen" class="screen hidden" style="background: rgba(255,255,255,0.98);">
                <button id="btn-shop-back-top"
                    style="position:absolute; top:20px; left:20px; font-size:1.5rem; background:#bdc3c7; padding:0.5rem 1rem;">🔙</button>
                <h1 style="margin-top: 40px;">SHOP</h1>
                <p>Coins: <span id="shop-coins">0</span> 🪙</p>
                <div id="shop-items"
                    style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; max-width: 800px; margin-bottom: 20px;">
                    <!-- Items generated by JS -->
                </div>
                <button id="btn-close-shop" style="margin-top: 10px; background-color: #e74c3c;">BACK TO MENU</button>
            </div>
            <div id="reward-select-screen" class="screen hidden">
                <h1>Reward Time!</h1>
                <p>You scored 100 points! Choose a game to play for 5 minutes:</p>
                <div class="reward-buttons">
                    <button id="btn-asteroids" class="reward-btn">PLAY ASTEROIDS</button>
                </div>
            </div>
            <div id="reward-hud" class="hidden">
                <div class="hud-item left">Time Left: <span id="reward-timer">5:00</span></div>
                <button id="reward-exit-btn" class="hud-item right" style="pointer-events:auto; font-size: 1.5rem;">Exit
                    Reward</button>
            </div>
            <div id="game-over-screen" class="screen hidden">
                <h1>Game Over</h1>
                <p>Score: <span id="final-score">0</span></p>
                <button id="restart-btn" style="margin-bottom: 20px;">TRY AGAIN</button>
                <button id="menu-btn" style="font-size: 1.5rem; background-color: #95a5a6; padding: 0.8rem 2rem;">CHANGE
                    DIFFICULTY</button>
            </div>
            <div id="hud" class="hidden">
                <div class="hud-item left">
                    Score: <span id="score-display">0</span><br>
                    <span style="font-size: 1rem; color: #FFD93D;">Coins: <span id="coins-display">0</span></span>
                </div>
                <div class="hud-item right">Lives: <span id="lives-display">❤️❤️❤️</span></div>
            </div>
            <div id="timer-bar-container">
                <div id="timer-bar"></div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
    <script  src="./script.js"></script>

  </body>
  
</html>
